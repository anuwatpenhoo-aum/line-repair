<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบแจ้งซ่อม</title>
<style>
:root{
  --bg:#F4F6F8; --card:#FFFFFF; --ink:#1F2933; --muted:#6B7785; --line:#E3E8EE;
  --pri:#06A94D; --pri-ink:#FFFFFF; --pri-soft:#E6F7EE;
  --blue:#1C7ED6; --blue-soft:#E7F1FB; --warn:#E67700; --warn-soft:#FFF4E6;
  --bad:#C92A2A; --bad-soft:#FFF0F0; --violet:#7048E8;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Sarabun","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif}
body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
.top h1{font-size:17px;margin:0;flex:1}
.top .back{border:0;background:none;font-size:22px;line-height:1;padding:2px 6px;color:var(--muted)}
.wrap{max-width:640px;margin:0 auto;padding:12px 12px 0}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--pri-soft);color:var(--pri);font-size:12px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
label.f b{color:var(--bad);font-weight:600}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=search],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:#FBFCFD;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-soft);border-color:var(--pri)}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#FBFCFD;border-radius:999px;padding:8px 12px;font:inherit;font-size:14px;color:var(--ink)}
.chip.on{background:var(--pri-soft);border-color:var(--pri);color:#036B30;font-weight:600}
.grp{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.grp>.gh{padding:10px 12px;font-weight:600;font-size:14px;background:#FAFBFC;display:flex;gap:8px}
.grp>.gh .gn{color:var(--pri)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--pri);flex:none}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{width:78px;height:78px;border-radius:10px;background:#EEF1F4 center/cover;position:relative;border:1px solid var(--line)}
.ph button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#000A;color:#fff;font-size:13px}
.ph.add{display:grid;place-items:center;color:var(--muted);font-size:26px;border-style:dashed;cursor:pointer}
.sig{border:1.5px dashed #B8C2CC;border-radius:12px;background:#fff;position:relative;touch-action:none}
.sig canvas{display:block;width:100%;height:170px;border-radius:12px}
.sig .ph-t{position:absolute;inset:0;display:grid;place-items:center;color:#A0AAB4;pointer-events:none;font-size:14px}
.sig .clr{position:absolute;right:8px;top:8px;border:0;background:#F1F3F5;border-radius:8px;padding:4px 10px;font:inherit;font-size:13px;color:var(--muted)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;font-size:16px;background:var(--pri);color:var(--pri-ink)}
.btn.sec{background:#EEF1F4;color:var(--ink)}
.btn.blue{background:var(--blue)}.btn.red{background:#E03131}.btn.warn{background:var(--warn)}.btn.bad{background:var(--bad)}
.btn[disabled]{opacity:.55}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;border-radius:10px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px}.bar .in>*{flex:1}
.consent{display:flex;gap:10px;font-size:13px;color:var(--muted);align-items:flex-start}
.consent input{width:20px;height:20px;accent-color:var(--pri);flex:none;margin-top:1px}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.s-new{background:var(--warn-soft);color:var(--warn)} .s-asg{background:var(--blue-soft);color:var(--blue)}
.s-pln{background:#F3F0FF;color:var(--violet)} .s-wa{background:#E6FCF5;color:#087F5B}
.s-rej{background:var(--bad-soft);color:var(--bad)} .s-pau{background:#FFF4E6;color:#A35200}
.ph.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:20px}
.ph.add span{font-size:11px;color:var(--muted)}
.stp{display:flex;gap:0;margin:2px 0 6px}
.stp .s{flex:1;text-align:center;position:relative;font-size:11px;color:var(--muted);line-height:1.25}
.stp .s i{display:block;width:22px;height:22px;border-radius:50%;margin:0 auto 5px;background:#E3E8EE;color:#fff;font-style:normal;font-size:12px;line-height:22px;position:relative;z-index:1}
.stp .s:before{content:'';position:absolute;top:11px;left:-50%;width:100%;height:3px;background:#E3E8EE}
.stp .s:first-child:before{display:none}
.stp .s.on i{background:var(--ok,#2B8A3E)} .stp .s.on:before{background:var(--ok,#2B8A3E)}
.stp .s.on{color:#1F2933;font-weight:600}
.stp .s.cur i{box-shadow:0 0 0 4px rgba(43,138,62,.15)}
.stp .s.warn i{background:#E67700} .stp .s.warn{color:#A35200}
.nowbox{background:#F1F8F3;border:1px solid #CFE8D6;border-radius:12px;padding:12px 14px;margin-top:8px}
.nowbox b{display:block;font-size:16px;color:#1B5E2A;margin-bottom:2px}
.foldh{display:flex;align-items:center;gap:10px;justify-content:space-between} .s-cls{background:#EEF1F4;color:#495057} .s-cxl{background:#F8F9FA;color:#ADB5BD}
.tk{display:block;background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(16,24,40,.05);color:inherit;text-decoration:none}
.tk .l1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tk .no{font-weight:700}
.tk .l2{font-size:14px;margin-top:4px}
.tk .l3{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.tk .od{color:var(--bad);font-weight:600}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 10px 8px;font-size:13.5px}
.tl li:before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--pri)}
.tl .ts{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.tab{border:0;background:#E9ECEF;border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;white-space:nowrap;color:var(--ink)}
.tab.on{background:var(--ink);color:#fff}
.tab i{font-style:normal;opacity:.7;margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:11.5px;color:var(--muted)}
.rate{display:flex;gap:6px}
.rate button{flex:1;border:1px solid var(--line);background:#FBFCFD;border-radius:10px;padding:8px 2px;font:inherit;font-size:12px;color:var(--ink)}
.rate button b{display:block;font-size:18px}
.rate button.on{background:var(--pri-soft);border-color:var(--pri);color:#036B30}
.seg{display:flex;gap:8px}.seg button{flex:1;border:1px solid var(--line);background:#FBFCFD;border-radius:10px;padding:10px 6px;font:inherit;font-size:14px;color:var(--ink)}
.seg button.on{background:var(--pri-soft);border-color:var(--pri);color:#036B30;font-weight:700}
.seg button.on.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.center{text-align:center}
.done-ic{width:72px;height:72px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-size:38px;margin:24px auto 10px}
.muted{color:var(--muted)} .small{font-size:13px}
.note{background:var(--blue-soft);color:#1864AB;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.sheet{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end}
.sbox{background:var(--card);width:100%;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .18s ease-out}
.sbox h2{margin:0 0 6px;font-size:17px}
.seg button{white-space:nowrap}
.card.st.off{opacity:.62}
.disp{background:#FFF4E6;color:#A35200;border:1px solid #FFD8A8}.disp.late{background:#FFF5F5;color:#C92A2A;border-color:#FFA8A8}
.alarm{position:sticky;top:0;z-index:30;margin:-4px 0 12px;padding:12px 14px;border-radius:12px;background:#C92A2A;color:#fff;font-weight:700;display:flex;gap:10px;align-items:center;animation:blink 1s steps(2,start) infinite}
.alarm.new{background:#E8590C;animation:none}.alarm button{flex:none;width:auto;padding:0 14px;height:36px;border-radius:10px;border:0;background:#fff;color:#C92A2A;font-weight:700}
@keyframes blink{50%{background:#7A1414}}
.sndbtn{flex:none;width:auto;padding:0 12px}.sndbtn.on{background:#EBFBEE;color:#2B8A3E;border-color:#B2F2BB}
.codes{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 2px}.codes span{font-size:12px;background:#F1F3F5;border-radius:6px;padding:2px 8px;color:#495057}.codes b{color:#1C7ED6}
.scanrow{display:flex;gap:8px}.scanrow input{flex:1}.scanrow button{flex:none;width:auto;padding:0 14px}
.catline{margin:0 0 4px;padding:8px 10px;border-radius:10px;background:#F1F3F5;font-size:14px}
.ro{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#F8F9FA;font-weight:600}
.namerow{display:flex;gap:10px}.namerow>div{flex:1;min-width:0}
.locq{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}.locq button{border:1px dashed #74C0FC;background:#E7F5FF;color:#1864AB;border-radius:10px;padding:6px 10px;font-size:13px;text-align:left}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.catb{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:10px 12px;text-align:left;font:inherit;color:var(--ink);line-height:1.3}
.catb b{display:block;font-size:15px}.catb span{font-size:12px;color:var(--muted)}
.catb.on{border-color:var(--pri);background:var(--pri-soft)}.catb.on b{color:var(--pri)}
.catb:last-child:nth-child(odd){grid-column:1/-1}
.cardBox{margin:4px 0 8px 26px;padding:10px 12px;border-left:3px solid var(--pri-soft);background:#FBFCFD;border-radius:0 10px 10px 0}
.imgs.big img{width:calc(50% - 4px);height:auto;max-height:260px;aspect-ratio:4/3}
.zoomview{position:fixed;inset:0;background:#000d;z-index:50;display:grid;place-items:center;padding:12px}.zoomview img{max-width:100%;max-height:100%;border-radius:8px}
.kbc{display:block;text-decoration:none;color:inherit}.kbc h3{margin:0 0 4px;font-size:16px}.kbc p{margin:0;color:var(--muted);font-size:13.5px}
.kbc .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--pri-soft);color:var(--pri);font-size:12px;font-weight:600}
.tag.st{background:#FFF4E6;color:#A35200}
.kbbody{white-space:pre-wrap;line-height:1.75;font-size:15px}
.sec-h{font-size:14px;color:var(--muted);margin:16px 4px 8px;font-weight:600}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.srch{display:flex;gap:8px;margin-bottom:12px}.srch input{flex:1}
.cal{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.cal button{flex:none;min-width:58px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 6px;text-align:center;font:inherit;color:var(--muted);line-height:1.35}
.cal button b{display:block;font-size:17px;color:var(--ink)}
.cal button.on{background:var(--pri);border-color:var(--pri);color:#fff}.cal button.on b{color:#fff}
.cal button i{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--pri)}
.cal button.on i{color:#CFE3FF}
.caltt{font-weight:700;margin:2px 0 8px}.caltt .small{font-weight:400;color:var(--muted)}
.tgridw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.tgrid{min-width:700px}
.cj{display:grid;grid-template-columns:118px 1.6fr 1fr 1fr 1.1fr;gap:8px}.cj .cd{font-size:12px;font-weight:700;color:var(--pri);white-space:nowrap}
.tgr{display:grid;grid-template-columns:58px 1fr;border-top:1px solid var(--line);min-height:40px}
.tgr.tgh{background:#F1F3F5;border-top:0;min-height:0}.tgh .tgt,.tgh .cj{padding-top:8px;padding-bottom:8px;font-size:12px;font-weight:700;color:var(--muted)}
.tgr .tgt{padding:10px 0 10px 8px;font-weight:700;font-size:13px;color:var(--muted);white-space:nowrap}
.tgr.has .tgt{color:var(--pri)}
.tgr.now{background:#FFF9DB}.tgr.now .tgt{color:#A35200}
.tgj{min-width:0;padding-right:10px}
.cj{padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;color:var(--ink);text-decoration:none;word-break:break-word}
.cj:last-child{border-bottom:0}.cj b{font-size:14px}.cj .t2{font-size:12px;color:var(--muted);margin:2px 0}
.slot{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .tm{flex:none;width:52px;font-weight:700;color:var(--pri)}
.slot .bd{flex:1;min-width:0}.slot .bd .t2{font-size:13px;color:var(--muted)}
.note.warn{background:var(--warn-soft);color:#A35200}
.kv dd{white-space:pre-line}
.note.urgn{background:#FFF5F5;color:#C92A2A;border:1px solid #FFC9C9}
.urgb,.tk .urgb{display:inline-block;background:#E03131;color:#fff;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;vertical-align:1px}
.tk.isurg{border-left:4px solid #E03131}
.empty{text-align:center;color:var(--muted);padding:36px 0}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#212529;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.loading{position:fixed;inset:0;background:#fff9;display:grid;place-items:center;z-index:30}
.spin{width:36px;height:36px;border:4px solid var(--pri-soft);border-top-color:var(--pri);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.imgs{display:flex;gap:8px;flex-wrap:wrap}.imgs img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.imgs img.lz,.imgs img.lzw{background:var(--pri-soft) linear-gradient(100deg,#0000 30%,#fff8 50%,#0000 70%) 0 0/300% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-150% 0}}
#upd{position:fixed;top:0;left:0;right:0;height:3px;z-index:40;background:linear-gradient(90deg,var(--pri-soft),var(--pri),var(--pri-soft));background-size:220% 100%;animation:ld 1s linear infinite}
@keyframes ld{to{background-position:-220% 0}}
.hr{height:1px;background:var(--line);margin:12px 0}
.hidden{display:none!important}

.dwrap{max-width:1180px;margin:0 auto;padding:12px 12px 0}
.dgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.dgrid{grid-template-columns:1fr 1fr}.dgrid .wide{grid-column:1/-1}.kpis{grid-template-columns:repeat(6,1fr)!important}}
.dgrid .card{margin:0}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.kpi .lb{font-size:13px;color:var(--muted)} .kpi .v{font-size:28px;font-weight:700;line-height:1.2}
.kpi .dl{font-size:12.5px} .up{color:#2B8A3E} .dn{color:var(--bad)} .nt{color:var(--muted)}
.dhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.dhead select{width:auto;flex:1;min-width:180px;max-width:280px}
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.fchip{border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;font-weight:600}
.fchip b{font-size:18px;margin-left:6px}
.fchip.on{outline:2px solid var(--ink)}
.flist a{display:flex;justify-content:space-between;gap:8px;padding:9px 2px;border-top:1px solid var(--line);color:inherit;text-decoration:none;font-size:14px}
.flist a span:last-child{color:var(--muted);white-space:nowrap;font-size:13px}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 34px;gap:8px;align-items:center;font-size:13.5px;margin:6px 0}
.hbar .tr{background:#EEF1F4;border-radius:6px;height:14px;overflow:hidden}.hbar .fl{height:100%;border-radius:6px}
.hbar .n{text-align:right;font-weight:700}
table.tt{width:100%;border-collapse:collapse;font-size:14px}
table.tt th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:center;padding:6px 4px;border-bottom:1px solid var(--line)}
table.tt td{text-align:center;padding:8px 4px;border-bottom:1px solid var(--line)} table.tt td:first-child,table.tt th:first-child{text-align:left}
.rlist a{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none;font-size:14px}
.rlist .kd{font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;color:#fff;background:#2A6BD8}.rlist .kd.pdf{background:#C92A2A}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:4px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.vf-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.vf-sum .stat b{font-size:22px}.vf-sum .stat.bad b{color:var(--bad)}.vf-sum .stat.warn b{color:var(--warn)}.vf-sum .stat.ok b{color:#2B8A3E}
.vf{border-left:4px solid var(--warn)}.vf.ok{border-left-color:#2F9E44}.vf.no{border-left-color:var(--bad)}.vf.verified{border-left-color:#ADB5BD}
.vf .who{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.vf .who b{font-size:16px}.vf .why{display:inline-block;background:var(--warn-soft);color:#A35200;border-radius:8px;padding:2px 8px;font-size:12.5px;font-weight:600;margin:6px 6px 0 0}
.vf .why.bad{background:var(--bad-soft);color:var(--bad)}
.vf .sug{background:#F8F9FA;border:1px dashed #CED4DA;border-radius:10px;padding:8px 10px;margin:10px 0;font-size:13.5px}
.vf .tks{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}.vf .tks a{background:#EEF1F4;border-radius:8px;padding:3px 8px;font-size:12.5px;color:var(--ink);text-decoration:none}
.vf .tks a.u{background:var(--warn-soft);color:#A35200}
.vf .acts{display:flex;gap:8px;margin-top:10px}.vf .acts .btn{flex:1}

.imp .btn{flex:none;width:auto;padding:10px 16px;height:auto}

<body>
<div id="app"></div>
<div id="loading" class="loading hidden"><div class="spin"></div></div>

<script src="config.js"></script>
<script>
/* ================= core ================= */
const CFG = window.APP_CONFIG || {};
const Q = new URLSearchParams(location.search);
const MOCK = Q.get('mock') === '1';
let ID_TOKEN = null, INIT = null, PROFILE = null;
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const busy = on => $('#loading').classList.toggle('hidden', !on);
function toast(msg, ms) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms || 2600); }
const LS = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

let READY = null;                      // พร้อมยิง API เมื่อ LIFF ให้ idToken แล้ว
async function api(action, data) {
  if (READY) await READY;
  if (MOCK) return window.mockApi(action, data || {});
  const res = await fetch(CFG.GAS_URL, { method: 'POST', body: JSON.stringify({ action, idToken: ID_TOKEN, data: data || {} }) });
  const j = await res.json();
  if (!j.ok) {
    if (j.error === 'SESSION_EXPIRED') { liff.logout && liff.logout(); location.reload(); }
    throw new Error(j.error || 'เกิดข้อผิดพลาด');
  }
  return j;
}
async function run(fn) { busy(true); try { return await fn(); } catch (e) { toast(e.message || String(e), 4000); throw e; } finally { busy(false); } }

/* ---- แคชในเครื่อง: วาดของเดิมทันที แล้วค่อยอัปเดตเบื้องหลัง ---- */
const CK = 'rq1_';
const CACHE = {
  get(k) { return LS.get(CK + k, null); },
  set(k, v) { LS.set(CK + k, v); },
  drop(pre) { try { Object.keys(localStorage).forEach(k => { if (k.indexOf(CK + (pre || '')) === 0) localStorage.removeItem(k); }); } catch (e) {} }
};
let NAV = 0;                            // กันข้อมูลที่มาช้าทับหน้าใหม่
/** วาดจากแคชก่อน (ถ้ามี) แล้วดึงของจริงมาวาดทับ */
/** เก็บใบงานที่มาพร้อมรายการ ลงแคชรายใบ → กดเข้าไปดูขึ้นทันที */
function prime(r, isReporter, me) {
  (r.tickets || []).forEach(t => {
    if (t.item_ids === undefined) return;         // มาแบบย่อ ยังต้องดึงเพิ่ม
    CACHE.set('t' + t.no, { ticket: t, isReporter: isReporter, canWork: !isReporter && !!me && (me.role === 'admin' || (me.role !== 'viewer' && t.assigned_uid === me.uid)) });
  });
}
async function swr(key, call, render) {
  const my = ++NAV, old = CACHE.get(key);
  if (old) { render(old, true); mark(true); } else busy(true);
  try {
    const fresh = await call();
    CACHE.set(key, fresh);
    if (my === NAV) render(fresh, false);
  } catch (e) {
    if (my === NAV && !old) { app.innerHTML += `<div class="wrap"><div class="note warn">${esc(e.message || e)}</div></div>`; }
    else if (my === NAV) toast(e.message || String(e), 4000);
  } finally { if (my === NAV) { busy(false); mark(false); } }
}
/** แถบบางๆ บอกว่ากำลังอัปเดตข้อมูลอยู่ (ไม่บังหน้าจอ) */
function mark(on) {
  let b = $('#upd');
  if (on) { if (!b) { b = document.createElement('div'); b.id = 'upd'; document.body.appendChild(b); } }
  else if (b) b.remove();
}

/* ---- รูปภาพ: โหลดหลังวาดหน้าเสร็จ ---- */
const PHOTOS = {};
function imgsHtml(no, ids, kb) {
  if (!ids || !ids.length) return '';
  return '<div class="imgs' + (kb ? ' big' : '') + '">' + ids.map(id => PHOTOS[id]
    ? `<img src="${PHOTOS[id]}">`
    : `<img class="lz" ${kb ? 'data-kb' : 'data-no'}="${esc(no)}" data-p="${esc(id)}">`).join('') + '</div>';
}
function loadPhotos() {
  app.querySelectorAll('img.lz').forEach(async el => {
    const id = el.dataset.p;
    el.classList.remove('lz'); el.classList.add('lzw');
    try {
      const r = PHOTOS[id] ? { src: PHOTOS[id] }
        : el.dataset.kb ? await api('kbPhoto', { id: el.dataset.kb, pid: id }) : await api('photo', { no: el.dataset.no, id: id });
      if (r.src) { PHOTOS[id] = r.src; el.src = r.src; el.classList.remove('lzw'); }
    } catch (e) { el.remove(); }
  });
}
// แตะรูปเพื่อดูเต็มจอ (รูปขั้นตอน/หน้าจอ ต้องอ่านตัวหนังสือได้)
document.addEventListener('click', e => {
  const im = e.target.closest && e.target.closest('.imgs img');
  if (im && im.src) { const v = document.createElement('div'); v.className = 'zoomview'; v.innerHTML = '<img src="' + im.src + '">'; v.onclick = () => v.remove(); document.body.appendChild(v); }
});

function statusCls(s) {
  return { 'รอมอบหมาย': 's-new', 'มอบหมายแล้ว': 's-asg', 'นัดหมายแล้ว': 's-pln', 'พักงาน': 's-pau', 'รอตรวจงาน': 's-wa', 'ส่งกลับแก้ไข': 's-rej', 'ดำเนินการเสร็จสิ้น': 's-cls', 'ยกเลิก': 's-cxl' }[s] || 's-cls';
}
const badge = s => `<span class="badge ${statusCls(s)}">${esc(s)}</span>`;
/** บทบาท: admin = แอดมินจ่ายงาน (สิทธิ์เต็ม) · viewer = ผู้บริหาร (ดูอย่างเดียว) · tech = ช่าง */
const ROLE_TH = { admin: 'แอดมินจ่ายงาน', viewer: 'ผู้บริหาร (ดูอย่างเดียว)', tech: 'ช่าง' };
const isMgr = r => (r || INIT.me.role) === 'admin';
const isBoss = r => ['admin', 'viewer'].indexOf(r || INIT.me.role) >= 0;
/** ชื่อจริง: ตัดคำนำหน้า ตรวจว่าไม่มีตัวเลข/สัญลักษณ์ (ฝั่งเซิร์ฟเวอร์ตรวจซ้ำ) */
function nameErr(v, label) {
  const s = String(v || '').trim().replace(/^(นางสาว|นาง|นาย|น\.ส\.|ดร\.)\s*/, '');
  if (!s) return 'กรุณากรอก' + label;
  if (s.length < 2 || !/^[\u0E00-\u0E7Fa-zA-Z][\u0E00-\u0E7Fa-zA-Z.\- ]*$/.test(s) || /[\u0E50-\u0E59]/.test(s)) return label + 'ต้องเป็นชื่อจริง ตัวอักษรเท่านั้น (ไม่ใส่นามแฝง ตัวเลข หรือสัญลักษณ์)';
  return '';
}
/** ช่องชื่อ + นามสกุล แยกกัน */
function nameFields(first, last, hintText) {
  return `<label class="f">ชื่อ-นามสกุล <b>*</b> <span class="small" style="color:var(--bad)">(ไม่ใส่นามแฝง ให้ใส่ชื่อจริงเท่านั้น)</span></label>
    <div class="namerow"><div><input type="text" id="fn" placeholder="ชื่อจริง" value="${esc(first || '')}" autocomplete="given-name"></div>
    <div><input type="text" id="ln" placeholder="นามสกุล" value="${esc(last || '')}" autocomplete="family-name"></div></div>
    <div class="hint">${hintText || 'ไม่ต้องใส่คำนำหน้า (นาย/นาง/นางสาว)'}</div>`;
}
/** ป้ายรหัสคิว / รหัสแจ้งซ่อม */
function codesHtml(t) {
  return `<div class="codes"><span>รหัสคิว <b>${esc(t.queue_code || '-')}</b></span><span>รหัสแจ้งซ่อม <b>${esc(t.code || 'ออกให้เมื่อนัดหมายเข้าดำเนินการ')}</b></span></div>`;
}
function topBar(title, backTo) {
  return `<div class="top">${backTo ? `<button class="back" onclick="go('${backTo}')">‹</button>` : ''}<h1>${esc(title)}</h1></div>`;
}
function go(page, no, extra) {
  const u = new URL(location.href);
  u.searchParams.set('p', page);
  if (no) u.searchParams.set('no', no); else u.searchParams.delete('no');
  ['onsite', 'q', 'd', 'm', 'c', 'id', 'from', 'act'].forEach(k => u.searchParams.delete(k));
  if (extra) Object.keys(extra).forEach(k => u.searchParams.set(k, extra[k]));
  history.pushState({}, '', u); route();
}
window.addEventListener('popstate', route);
function closeApp() { if (!MOCK && window.liff && liff.isInClient()) liff.closeWindow(); else go('mine'); }

/* ============ image & signature helpers ============ */
function compressImage(file, max, q) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, (max || 1280) / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', q || 0.72));
    };
    img.onerror = () => reject(new Error('อ่านไฟล์รูปไม่ได้'));
    img.src = url;
  });
}
function photoPicker(el, max) {
  const st = { list: [] };
  const mk = capture => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = 'image/*'; i.className = 'hidden';
    if (capture) i.setAttribute('capture', 'environment'); else i.multiple = true;
    i.onchange = async () => {
      for (const f of Array.from(i.files).slice(0, max - st.list.length)) { try { st.list.push(await compressImage(f)); } catch (e) { toast(e.message); } }
      i.value = ''; draw();
    };
    el.after(i); return i;
  };
  const cam = mk(true), gal = mk(false);
  const draw = () => {
    el.innerHTML = st.list.map((d, i) => `<div class="ph" style="background-image:url(${d})"><button type="button" data-i="${i}">✕</button></div>`).join('') +
      (st.list.length < max ? '<div class="ph add cam">📷<span>ถ่ายภาพ</span></div><div class="ph add gal">🖼<span>เลือกรูป</span></div>' : '');
    el.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => { st.list.splice(+b.dataset.i, 1); draw(); });
    const c = el.querySelector('.cam'); if (c) c.onclick = () => cam.click();
    const g = el.querySelector('.gal'); if (g) g.onclick = () => gal.click();
  };
  draw(); return st;
}
function signaturePad(box) {
  box.innerHTML = '<canvas></canvas><div class="ph-t">เซ็นชื่อในกรอบนี้</div><button type="button" class="clr">ล้าง</button>';
  const cv = box.querySelector('canvas'), hint = box.querySelector('.ph-t'), ctx = cv.getContext('2d');
  let drawing = false, empty = true, last = null, minX = 1e9, minY = 1e9, maxX = 0, maxY = 0;
  const size = () => { const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; ctx.scale(d, d); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0B2E6B'; };
  size();
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.addEventListener('pointerdown', e => { drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); });
  cv.addEventListener('pointermove', e => {
    if (!drawing) return; const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p;
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
    if (empty) { empty = false; hint.classList.add('hidden'); }
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cv.addEventListener(t, () => { drawing = false; }));
  box.querySelector('.clr').onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); empty = true; hint.classList.remove('hidden'); minX = minY = 1e9; maxX = maxY = 0; };
  return {
    isEmpty: () => empty || (maxX - minX < 15 && maxY - minY < 15),
    toDataURL() {
      const d = window.devicePixelRatio || 1, pad = 8;
      const x = Math.max(0, (minX - pad) * d), y = Math.max(0, (minY - pad) * d);
      const w = Math.min(cv.width - x, (maxX - minX + pad * 2) * d), h = Math.min(cv.height - y, (maxY - minY + pad * 2) * d);
      const o = document.createElement('canvas'); o.width = w; o.height = h; o.getContext('2d').drawImage(cv, x, y, w, h, 0, 0, w, h);
      return o.toDataURL('image/png');
    }
  };
}

/* ================= pages ================= */
async function route() {
  const u = new URL(location.href);
  const p = u.searchParams.get('p') || 'form';
  const no = u.searchParams.get('no');
  window.scrollTo(0, 0);
  const pages = { reg: pageReg, dash: pageDash, form: pageForm, mine: pageMine, ticket: pageTicket, accept: pageAccept, staff: pageStaff, job: pageJob, mysig: pageMySig, search: pageSearch, cal: pageCal, team: pageTeam, kb: pageKb, kbv: pageKbView, kbe: pageKbEdit, verify: pageVerify };
  (pages[p] || pageForm)(no);
}

/* ---------- 1) ฟอร์มแจ้งซ่อม ---------- */
/* ---------- 0) ลงทะเบียนผู้แจ้ง (ครั้งแรกครั้งเดียว) ---------- */
/** สถานะยืนยันตัวตนของผู้แจ้ง (แสดงในหน้าข้อมูลของฉัน / ฟอร์มแจ้งซ่อม) */
function verifyNote(P) {
  if (!P || !P.verify) return '';
  if (P.verify === 'verified' || P.verify === 'approved') return '<div class="note" style="margin:12px 0 0;background:#EBFBEE;color:#2B8A3E">✓ ยืนยันตัวตนแล้ว</div>';
  if (P.verify === 'denied') return `<div class="note warn" style="margin:12px 0 0;background:var(--bad-soft);color:var(--bad)">${esc(P.deny_text || 'บัญชีนี้ไม่มีสิทธิ์แจ้งซ่อม')}</div>`;
  return `<div class="note warn" style="margin:12px 0 0">ยังไม่ยืนยันตัวตน: ${esc(P.verify_reason || '')}<br><span class="small">แจ้งซ่อมได้ตามปกติ เจ้าหน้าที่จะตรวจสอบภายหลัง · ตรวจชื่อ-นามสกุลให้ตรงกับทะเบียนบุคลากร</span></div>`;
}
/** เลือกภาควิชา/หน่วยงานแบบขั้นบันได: สังกัดใหญ่ → แผนก → หน่วย (ค้นหาได้ และพิมพ์เองได้ถ้าไม่พบ) */
function deptPicker(depts, cur, onPick) {
  // สร้างต้นไม้จากรายการ { v: ชื่อหน่วย, p: สายสังกัด "ก › ข" }
  const node = {}, kids = { '': [] };
  depts.forEach(x => { const path = x.p ? x.p + ' › ' + x.v : x.v; node[path] = { v: x.v, p: x.p, path }; (kids[x.p] = kids[x.p] || []).push(path); });
  Object.keys(kids).forEach(k => kids[k].sort((a, b) => node[a].v.localeCompare(node[b].v, 'th')));
  let at = '';   // สายสังกัดที่กำลังดูอยู่ ('' = ระดับบนสุด)
  app.insertAdjacentHTML('beforeend', `<div class="sheet" id="dpSheet"><div class="sbox" style="height:86vh;display:flex;flex-direction:column">
    <h2 style="margin-bottom:8px">เลือกภาควิชา/หน่วยงาน</h2>
    <input type="search" id="dpQ" placeholder="🔍 หรือพิมพ์ค้นหา เช่น สรีรวิทยา, พัสดุ" autocomplete="off">
    <div id="dpCrumb" class="dpc"></div>
    <div id="dpL" style="flex:1;overflow:auto;margin:4px -4px 0;padding:0 4px"></div>
    <div style="border-top:1px solid var(--line);padding-top:10px;margin-top:6px" id="dpOther"><a href="javascript:void 0" id="dpOwn">ไม่พบหน่วยงานของฉัน — พิมพ์เอง</a></div>
    <div class="row" style="margin-top:10px"><button class="btn sec" id="dpX">ยกเลิก</button></div></div></div>`);
  const close = () => { const e = $('#dpSheet'); if (e) e.remove(); };
  const pick = v => { onPick(v); close(); };
  const norm = t => String(t || '').toLowerCase().replace(/\s+/g, '');
  const item = (path, sub) => { const n = node[path], more = (kids[path] || []).length;
    return `<button type="button" class="dpi${n.v === cur ? ' on' : ''}" data-path="${esc(path)}" data-more="${more ? 1 : 0}"><b>${esc(n.v)}</b>${sub && n.p ? `<span>${esc(n.p)}</span>` : more ? `<span>${more} หน่วยย่อย</span>` : ''}${more ? '<i>›</i>' : ''}</button>`; };
  const bind = () => app.querySelectorAll('#dpL [data-path]').forEach(b => b.onclick = () => {
    if (b.dataset.more === '1' && !norm($('#dpQ').value)) { at = b.dataset.path; draw(); $('#dpL').scrollTop = 0; } else pick(node[b.dataset.path].v);
  });
  const draw = () => {
    const q = norm($('#dpQ').value);
    if (q) {   // ค้นหา: แสดงผลแบบรายการเดียว พร้อมบอกสังกัด
      $('#dpCrumb').innerHTML = '';
      const l = Object.keys(node).filter(k => norm(k).indexOf(q) >= 0).slice(0, 150);
      $('#dpL').innerHTML = l.length ? l.map(k => item(k, true)).join('') : '<div class="empty">ไม่พบ — ลองคำอื่น หรือกด "พิมพ์เอง" ด้านล่าง</div>';
    } else {
      const parts = at ? at.split(' › ') : [];
      $('#dpCrumb').innerHTML = `<a href="javascript:void 0" data-at="">ทั้งหมด</a>` + parts.map((x, i) => ` › <a href="javascript:void 0" data-at="${esc(parts.slice(0, i + 1).join(' › '))}">${esc(x)}</a>`).join('');

  on('pauseOpen', () => { const b = $('#pauseBox'); b.classList.toggle('hidden'); if (!b.classList.contains('hidden')) b.scrollIntoView({ block: 'center', behavior: 'smooth' }); });
  on('editPlan', () => { const b = document.querySelector('#planCard .foldb'); if (b) b.classList.toggle('hidden'); });

  const planSel = $('#plan'); if (planSel) planSel.onchange = () => $('#daysBox').classList.toggle('hidden', !['wait', 'external'].includes(planSel.value));
  on('savePlan', async () => {

    if (clashNo) return toast('เวลานี้ชนกับนัดงาน ' + clashNo + ' กรุณาเลือกเวลาอื่น');
    const pr = await run(() => api('plan', d)); toast(!t.code && pr.ticket.code ? 'ออกรหัสแจ้งซ่อม ' + pr.ticket.code + ' และแจ้งผู้แจ้งแล้ว' : 'บันทึกและแจ้งผู้แจ้งแล้ว', 3500); stale(); refresh('sc'); pageJob(no);
  });
  // เตือนเมื่อนัดชนกับงานอื่นของช่างคนเดียวกัน (ดูจากรายการงานที่โหลดมาแล้ว)
  const toMin = hm => { const m = String(hm || '').match(/^(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null; };
  const gap = Math.max(1, Number(INIT.appointGap == null ? 60 : INIT.appointGap));
  let clashNo = null;
  const chk = () => {
    const box = $('#clash'), btn = $('#savePlan'); if (!box) return;
    const dt = $('#appoint').value, tm = toMin($('#appointT').value);
    const booked = (s.tickets || []).filter(x => x.no != no && x.assigned_uid && x.assigned_uid === (t.assigned_uid || me.uid)
      && x.appoint_iso === dt && ['นัดหมายแล้ว', 'พักงาน', 'ส่งกลับแก้ไข'].indexOf(x.status) >= 0 && toMin(x.appoint_time) !== null)
      .sort((a, b) => toMin(a.appoint_time) - toMin(b.appoint_time));
    const hit = tm === null ? null : booked.find(x => Math.abs(toMin(x.appoint_time) - tm) < gap);
    clashNo = hit ? tcode(hit) : null;
    if (!booked.length) { box.className = 'hidden'; box.innerHTML = ''; }
    else {
      box.className = hit ? 'note warn' : 'note';
      box.innerHTML = (hit ? `<b>⚠ ชนกับนัดงาน ${esc(tcode(hit))} เวลา ${esc(hit.appoint_time)} น.</b><br>นัดของช่างคนเดียวกันต้องห่างกันอย่างน้อย ${gap} นาที กรุณาเลือกเวลาอื่น<br>` : '') +
        'นัดที่มีแล้ววันนี้: ' + booked.map(x => `${esc(x.appoint_time)} น. (${esc(tcode(x))})`).join(' · ');
    }
    if (btn) { btn.disabled = !!hit; btn.style.opacity = hit ? .5 : 1; }
  };
  ['appoint', 'appointT'].forEach(id => { const e = $('#' + id); if (e) { e.onchange = chk; e.oninput = chk; } });
  chk();
  on('reclass', () => reclassSheet(t, () => { stale(); pageJob(no); }));
  const aph = $('#aph') ? photoPicker($('#aph'), 3) : null;
  const complete = async onsite => {
    if (!me.hasSignature) { toast('กรุณาบันทึกลายเซ็นช่างก่อน'); return go('mysig'); }
    const pl = $('#plan');
    const d = { no, onsite, cause: pick('cause'), solution: pick('sol'), advice: $('#adv').value.trim(), asset_code: $('#asset').value.trim(), after_photos: aph ? aph.list : [],
      plan: pl ? pl.value : '', plan_days: $('#days') ? $('#days').value : '' };
    if (!t.category) return toast('งานนี้ยังไม่มีประเภทของปัญหา — กด "แก้ไขประเภทงานและรายละเอียด" ก่อน', 4000);
    if (!d.cause || !d.solution) return toast('กรุณาเลือกสาเหตุที่พบ และแนวทางการแก้ไข');
    if (!d.after_photos.length) { toast('กรุณาถ่ายรูปหลังดำเนินการอย่างน้อย 1 รูป'); $('#aph').scrollIntoView({ block: 'center' }); return; }
    if (!d.asset_code) { toast('กรุณากรอกรหัสครุภัณฑ์ (งานที่ไม่มีครุภัณฑ์ ใส่ -)'); const a = $('#asset'); a.focus(); a.scrollIntoView({ block: 'center' }); return; }

    if (!d.cause || !d.solution) return toast('กรุณาเลือกสาเหตุที่พบ และแนวทางการแก้ไข');
    if (!d.asset_code) return toast('กรุณากรอกรหัสครุภัณฑ์ (ไม่มีใส่ -)');
    const r2 = await run(() => api('editResult', d));
    toast(r2.changed && r2.changed.length ? 'บันทึกการแก้ไขแล้ว' : 'ไม่มีข้อมูลที่เปลี่ยน'); stale(); pageJob(no);
  });
  on('resend', async () => { await run(() => api('requestAccept', { no })); toast('ส่งแล้ว'); });
  on('cxl', async () => { const reason = prompt('เหตุผลการยกเลิก'); if (!reason) return; await run(() => api('cancel', { no, reason })); toast('ยกเลิกแล้ว'); stale(); pageJob(no); });
}


/** ตัวเลือกสาเหตุ/แนวทางแก้ไขตามประเภทของใบงาน (+ ตัวเลือกที่ใช้ได้ทุกประเภท) */
function catOpts(kind, cat) {
  const O = INIT.lists.options || {}, by = (O.byCat || {})[kind];
  if (!by) return O[kind] || [];
  const own = (cat && by[cat]) || [], all = by[''] || [];
  const list = own.concat(all.filter(x => own.indexOf(x) < 0));
  return list.length ? list : (O[kind] || []);
}
/** หน้าต่างแก้ประเภทงาน/รายการ/รายละเอียด (ช่าง/แอดมิน) */
function reclassSheet(t, done) {
  const L = INIT.lists, st = { cat: t.category || '', item: (t.item_ids || [])[0] || '' };
  const FLAG = {}; L.groups.forEach(g => g.items.forEach(it => { FLAG[it.id] = it; }));
  app.insertAdjacentHTML('beforeend', `<div class="sheet" id="rcSheet"><div class="sbox" style="max-height:88vh;overflow:auto">
    <h2>แก้ไขประเภทงานและรายละเอียด</h2>
    <div class="hint">เดิม: ${esc(t.category || 'ไม่ระบุประเภท')} · ${esc(t.items_text || '-')}</div>
    <label class="f">ประเภทของปัญหา <b>*</b></label><div class="chips" id="rcC">${L.categories.map(c => `<button type="button" class="chip" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div>
    <label class="f">รายการ <b>*</b></label><div id="rcI"></div>
    <div id="rcCard" class="hidden"><label class="f">ชื่อ-นามสกุล (เจ้าของบัตร) <b>*</b></label><input type="text" id="rcCn" value="${esc(t.card_name || '')}"></div>
    <label class="f">รายละเอียด/สาเหตุการแจ้งซ่อม <b>*</b></label><textarea id="rcD">${esc(t.detail || '')}</textarea>
    <div class="row" style="margin-top:12px"><button class="btn sec" id="rcX">ยกเลิก</button><button class="btn" id="rcOk">บันทึก</button></div>
  </div></div>`);
  const draw = () => {
    app.querySelectorAll('#rcC .chip').forEach(x => x.classList.toggle('on', x.dataset.c === st.cat));
    const items = [];
    L.groups.forEach(g => g.items.forEach(it => { if (it.cat === st.cat || !it.cat) items.push(it); }));
    if (items.every(it => it.id !== st.item)) st.item = '';
    $('#rcI').innerHTML = st.cat ? items.map(it => `<label class="chk"><input type="radio" name="rci" value="${it.id}"${it.id === st.item ? ' checked' : ''}><span>${esc(it.name)}${!it.cat ? ' <span class="small muted">(อื่นๆ)</span>' : ''}</span></label>`).join('') : '<div class="hint">เลือกประเภทก่อน</div>';
    app.querySelectorAll('#rcI input').forEach(rb => rb.onchange = () => { st.item = rb.value; $('#rcCard').classList.toggle('hidden', !(FLAG[st.item] && FLAG[st.item].card)); });
    $('#rcCard').classList.toggle('hidden', !(FLAG[st.item] && FLAG[st.item].card));
  };
  app.querySelectorAll('#rcC .chip').forEach(c => c.onclick = () => { st.cat = c.dataset.c; draw(); });
  draw();
  const close = () => { const e = $('#rcSheet'); if (e) e.remove(); };
  $('#rcX').onclick = close;
  $('#rcSheet').onclick = e => { if (e.target.id === 'rcSheet') close(); };
  $('#rcOk').onclick = async () => {
    const d = { no: t.no, category: st.cat, item_id: st.item, detail: $('#rcD').value.trim() };
    if (FLAG[st.item] && FLAG[st.item].card) d.card_name = $('#rcCn').value.trim();
    if (!d.category) return toast('กรุณาเลือกประเภทของปัญหา');
    if (!d.item_id) return toast('กรุณาเลือกรายการ');
    if (d.detail.length < 5) return toast('กรุณาระบุรายละเอียดให้ชัดเจน');
    const r = await run(() => api('reclassify', d));
    close(); toast(r.changed && r.changed.length ? 'แก้ไขแล้ว · บันทึกประวัติไว้' : 'ไม่มีการเปลี่ยนแปลง'); done();
  };
}
/** สแกน QR สติกเกอร์ครุภัณฑ์ (ใน QR คือเลข AS-xxxxxxxxx) — ใช้กล้องของ LINE (liff.scanCodeV2)
 *  ถ้าเปิดนอก LINE ใช้ BarcodeDetector ของเบราว์เซอร์แทน */
function assetFromQr(txt) {
  const s = String(txt || '').trim();
  const m = s.match(/\bAS-?\d{6,}\b/i);
  if (m) return m[0].toUpperCase().replace(/^AS(\d)/, 'AS-$1');
  if (/^https?:\/\//i.test(s)) return '';            // เช่น QR ของ สมอ. บนฉลากเครื่อง ไม่ใช่รหัสครุภัณฑ์
  return s.length <= 60 ? s : '';
}
async function scanAsset(done) {
  const use = raw => {
    const v = assetFromQr(raw);
    if (!v) return toast('QR นี้ไม่ใช่รหัสครุภัณฑ์ (อาจเป็น QR ของ สมอ./ผู้ผลิต) — สแกน QR บนสติกเกอร์ครุภัณฑ์ที่มีเลข AS-', 4500);
    done(v); toast('อ่านรหัสครุภัณฑ์: ' + v);
  };
  try {
    if (!MOCK && window.liff && liff.isInClient() && liff.scanCodeV2) { const r = await liff.scanCodeV2(); if (r && r.value) use(r.value); return; }
  } catch (e) { toast('เปิดกล้องสแกนของ LINE ไม่ได้: ' + (e.message || e) + ' — ลองวิธีสำรอง', 3500); }
  if (!('BarcodeDetector' in window)) return toast('อุปกรณ์นี้สแกน QR ไม่ได้ — กรุณาพิมพ์รหัสครุภัณฑ์ (เลข AS- ใต้ QR)', 4000);
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); } catch (e) { return toast('เปิดกล้องไม่ได้ — กรุณาอนุญาตกล้อง หรือพิมพ์รหัสเอง', 4000); }
  app.insertAdjacentHTML('beforeend', '<div class="sheet" id="qrSheet"><div class="sbox"><h2>สแกน QR ครุภัณฑ์</h2><video id="qrV" playsinline muted style="width:100%;border-radius:12px;background:#000"></video><div class="hint">เล็งกล้องไปที่ QR บนสติกเกอร์ครุภัณฑ์ (มีเลข AS- ใต้ QR)</div><div class="row" style="margin-top:10px"><button class="btn sec" id="qrX">ปิด</button></div></div></div>');
  const v = $('#qrV'); v.srcObject = stream; await v.play().catch(() => {});
  const det = new BarcodeDetector({ formats: ['qr_code'] });
  let alive = true;
  const stop = () => { alive = false; stream.getTracks().forEach(x => x.stop()); const e = $('#qrSheet'); if (e) e.remove(); };
  $('#qrX').onclick = stop;
  const tick = async () => {
    if (!alive) return;
    try { const c = await det.detect(v); const hit = c.map(x => x.rawValue).find(x => assetFromQr(x)); if (hit) { stop(); use(hit); return; } } catch (e) { /* ลองต่อ */ }
    setTimeout(tick, 250);
  };
  tick();
}

/* ---------- 6) ตรวจสิทธิ์ผู้แจ้ง (แอดมิน) + นำเข้า/ส่งออกรายชื่อบุคลากร ---------- */
let VF_TAB = 'wait';
async function pageVerify() {
  if (!isMgr()) return pageStaff();
  app.innerHTML = topBar('ตรวจสิทธิ์ผู้แจ้ง', 'dash') + '<div class="wrap" id="vf"><div class="empty">กำลังโหลด...</div></div>';
  await swr('vf', () => api('verifyList', {}), r => drawVerify(r));
}
function drawVerify(r) {
  const cnt = k => r.users.filter(x => k === 'all' || x.st === k).length;
  const ST = { wait: ['รอตรวจ', 's-new'], ok: ['อนุญาตแล้ว', 's-ok'], no: ['ไม่มีสิทธิ์', 's-rej'], verified: ['ยืนยันแล้ว', 's-cls'] };
  const card = x => `<div class="card vf ${x.st}" data-uid="${esc(x.uid)}">
    <div class="who"><div><b>${esc(x.name)}</b><div class="small muted">${esc(x.dept || '-')} · 📞 ${esc(x.phone || '-')} · LINE: ${esc(x.line || '-')}</div></div>
      <span class="badge ${ST[x.st][1]}">${ST[x.st][0]}</span></div>
    <div>${x.why.map(w => `<span class="why${/บัญชีอื่น/.test(w) ? ' bad' : ''}">${esc(w)}</span>`).join('')}</div>
    ${x.sug ? `<div class="sug">🔎 ในรายชื่อบุคลากร: <b>${esc(x.sug.name)}</b>${x.sug.dept ? ' · ' + esc(x.sug.dept) : ''}${x.sug.d ? ' <span class="muted">(สะกดต่าง ' + x.sug.d + ' ตัว)</span>' : ''}</div>` : ''}
    <div class="small muted">ลงทะเบียน ${esc(x.reg || '-')} · แจ้งซ่อมเดือนนี้ ${x.tks.length} ใบ</div>
    ${x.tks.length ? `<div class="tks">${x.tks.map(t => `<a href="javascript:void 0" class="${t.unverified ? 'u' : ''}" onclick="go('job','${t.no}')">${esc(t.code)}</a>`).join('')}</div>` : ''}
    ${x.st === 'wait' ? `<div class="acts"><button class="btn sm" data-ok="${esc(x.uid)}">${x.sug ? '✓ ใช่คนนี้ · อนุญาต' : '✓ อนุญาต (บุคลากร)'}</button><button class="btn sec sm" style="color:var(--bad)" data-no="${esc(x.uid)}">✕ ไม่มีสิทธิ์</button></div>
      <div class="hidden" data-nobox="${esc(x.uid)}"><label class="f">เหตุผล <b>*</b></label><input type="text" placeholder="เช่น นิสิต / บุคคลภายนอก / แอบอ้างชื่อ">
      <div style="height:8px"></div><button class="btn bad sm" data-nook="${esc(x.uid)}">ยืนยัน ไม่มีสิทธิ์ (แจ้งซ่อมไม่ได้อีก)</button></div>`
      : x.st === 'verified' ? '' : `<div class="hint" style="margin-top:8px">${x.st === 'ok' ? '✓' : '✕'} ${esc(x.by)}${x.note ? ' — ' + esc(x.note) : ''} · <a href="javascript:void 0" data-reset="${esc(x.uid)}">เปลี่ยนผล</a></div>`}
  </div>`;
  const R = r.roster || {};
  $('#vf').innerHTML = `
    ${!r.enabled ? `<div class="note warn">ยังไม่ได้เปิดตรวจสิทธิ์ — ${R.n ? 'ปิดไว้ที่ Settings: VERIFY_ENABLED' : 'นำเข้ารายชื่อบุคลากรก่อน ระบบจึงจะเริ่มตรวจ'}</div>` : ''}
    <div class="vf-sum"><div class="stat ok"><b>${r.sum.verified}</b><span>ยืนยันแล้ว (ชื่อ+หน่วยงานตรง)</span></div><div class="stat warn"><b>${r.sum.wait}</b><span>รอตรวจ</span></div>
      <div class="stat"><b>${r.sum.ok}</b><span>แอดมินอนุญาต</span></div><div class="stat bad"><b>${r.sum.no}</b><span>ไม่มีสิทธิ์</span></div></div>
    <div class="card imp"><div style="flex:1;min-width:220px"><b>รายชื่อบุคลากร ${R.n ? '(' + R.n.toLocaleString() + ' คน)' : '(ยังไม่มี)'}</b>
      <div class="small muted">${R.at ? 'นำเข้าล่าสุด ' + esc(R.at) + (R.by ? ' โดย ' + esc(R.by) : '') + (R.file ? ' · ไฟล์ ' + esc(R.file) : '') + (R.excluded ? ' · ตัดออก ' + R.excluded + ' แถว' : '') : 'นำเข้าไฟล์จากโปรแกรม HIP หรือไฟล์ที่กรอกตามฟอร์มของระบบ'}</div></div>
      <div class="row2"><button class="btn blue sm" id="vfi">📥 นำเข้าไฟล์ .xls</button><button class="btn sec sm" id="vfe">📄 ส่งออกฟอร์ม</button>
        <button class="btn sec sm" id="vfa">➕ เพิ่มรายชื่อ</button><button class="btn sec sm" id="vfd" style="color:var(--bad)">🗑 ลบรายชื่อ</button>
        <button class="btn sec sm" id="vfu">🏢 หน่วยงาน</button></div>
      <input type="file" id="vff" accept=".xls,.xlsx" class="hidden"></div>
    <div class="tabs">${[['wait', 'รอตรวจ'], ['ok', 'อนุญาตแล้ว'], ['no', 'ไม่มีสิทธิ์'], ['all', 'ทั้งหมด']].map(([k, l]) => `<button class="tab${k === VF_TAB ? ' on' : ''}" data-t="${k}">${l}<i>${cnt(k)}</i></button>`).join('')}</div>
    <div class="vf-list" id="vfl"></div>
    <div class="hint" style="margin:14px 0">"อนุญาต" = ผูกบัญชี LINE นี้กับรายชื่อบุคลากร ครั้งต่อไปไม่ต้องตรวจอีก · "ไม่มีสิทธิ์" = บัญชีนี้แจ้งซ่อมไม่ได้อีก (ประวัติเดิมยังอยู่) · กด "เปลี่ยนผล" เพื่อให้ระบบตรวจใหม่</div>`;
  const drawList = () => {
    const l = r.users.filter(x => VF_TAB === 'all' || x.st === VF_TAB);
    $('#vfl').innerHTML = l.length ? l.map(card).join('') : '<div class="empty">ไม่มีรายการ 👍</div>';
    bind();
  };
  const done = () => { CACHE.drop('vf'); CACHE.drop('ov'); pageVerify(); };
  const bind = () => {
    app.querySelectorAll('[data-ok]').forEach(b => b.onclick = async () => { await run(() => api('verifyDecide', { uid: b.dataset.ok, decision: 'approve', bind: true })); toast('อนุญาตแล้ว'); done(); });
    app.querySelectorAll('[data-no]').forEach(b => b.onclick = () => { const bx = app.querySelector(`[data-nobox="${b.dataset.no}"]`); bx.classList.toggle('hidden'); const i = bx.querySelector('input'); if (i) i.focus(); });
    app.querySelectorAll('[data-nook]').forEach(b => b.onclick = async () => {
      const note = app.querySelector(`[data-nobox="${b.dataset.nook}"] input`).value.trim();
      if (note.length < 3) return toast('กรุณาระบุเหตุผล');
      await run(() => api('verifyDecide', { uid: b.dataset.nook, decision: 'deny', note })); toast('บันทึกแล้ว — บัญชีนี้แจ้งซ่อมไม่ได้'); done();
    });
    app.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => confirmSheet('เปลี่ยนผลการตรวจ?', 'ล้างผลที่ตัดสินไว้ แล้วให้ระบบตรวจกับรายชื่อบุคลากรใหม่', 'ล้างผล', async () => { await run(() => api('verifyReset', { uid: b.dataset.reset })); done(); }));
  };
  app.querySelectorAll('.tab').forEach(b => b.onclick = () => { VF_TAB = b.dataset.t; app.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b)); drawList(); });
  drawList();
  $('#vfa').onclick = () => rosterAddSheet(r.depts || []);
  $('#vfd').onclick = () => rosterDeleteSheet();
  $('#vfu').onclick = () => deptManager();
  $('#vfe').onclick = () => exportRosterForm();
  $('#vfi').onclick = () => $('#vff').click();
  $('#vff').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) importRoster(f, r.exclude); };
}

/** เพิ่มรายชื่อบุคลากรทีละ 1–2 คน */
function rosterAddSheet(depts) {
  const row = n => `<div class="card" style="margin:10px 0 0;padding:12px;background:#F8F9FA" data-p="${n}">
    <div class="small muted" style="margin-bottom:4px">คนที่ ${n}</div>
    <div class="row"><div><label class="f">ชื่อ <b>*</b></label><input type="text" data-f="first" placeholder="ไม่ต้องใส่คำนำหน้า"></div>
    <div><label class="f">นามสกุล <b>*</b></label><input type="text" data-f="last"></div></div>
    <label class="f">หน่วยงาน/ภาควิชา</label><input type="text" data-f="dept" list="rDepList" autocomplete="off" placeholder="พิมพ์แล้วเลือกจากรายการ"></div>`;
  app.insertAdjacentHTML('beforeend', `<div class="sheet" id="raSheet"><div class="sbox"><h2>เพิ่มรายชื่อบุคลากร</h2>
    <div class="hint">สำหรับเพิ่มทีละ 1–2 คน (เช่น บุคลากรใหม่) ถ้าจำนวนมากให้ใช้ "นำเข้าไฟล์ .xls"</div>
    <datalist id="rDepList">${depts.map(x => `<option value="${esc(x.p ? x.p + ' › ' + x.v : x.v)}">`).join('')}</datalist>
    <div id="raRows">${row(1)}</div>
    <div style="margin:10px 0"><a href="javascript:void 0" id="raMore">➕ เพิ่มอีก 1 คน</a></div>
    <div class="row"><button class="btn sec" id="raX">ยกเลิก</button><button class="btn" id="raOk">บันทึก</button></div></div></div>`);
  const close = () => { const e = $('#raSheet'); if (e) e.remove(); };
  $('#raX').onclick = close; $('#raSheet').onclick = e => { if (e.target.id === 'raSheet') close(); };
  $('#raMore').onclick = () => { $('#raRows').insertAdjacentHTML('beforeend', row(2)); $('#raMore').parentNode.remove(); };
  $('#raSheet [data-f=first]').focus();
  $('#raOk').onclick = async () => {
    const people = [...app.querySelectorAll('#raRows [data-p]')].map(b => { const g = f => b.querySelector(`[data-f=${f}]`).value.trim(); return { first: g('first'), last: g('last'), dept: g('dept') }; })
      .filter(p => p.first || p.last || p.dept);
    if (!people.length) return toast('กรุณากรอกชื่อ');
    if (people.some(p => !p.first || !p.last)) return toast('กรุณากรอกทั้งชื่อและนามสกุล');
    const r = await run(() => api('rosterAdd', { people }));
    close(); toast('เพิ่มแล้ว ' + r.added + ' คน' + (r.verified ? ' · ผู้แจ้งที่รอตรวจผ่านอัตโนมัติ ' + r.verified + ' คน' : ''), 4000);
    CACHE.drop('vf'); CACHE.drop('ov'); pageVerify();
  };
}
/** ค้นแล้วเลือกลบได้หลายคน (เลือกข้ามการค้นหาได้) */
function rosterDeleteSheet() {
  const picked = new Map();
  app.insertAdjacentHTML('beforeend', `<div class="sheet" id="rdSheet"><div class="sbox" style="max-height:90vh">
    <h2>ลบรายชื่อบุคลากร</h2>
    <div class="srch"><input type="search" id="rdQ" placeholder="ค้นชื่อ นามสกุล หรือหน่วยงาน"><button class="btn sm" id="rdGo" style="flex:none;width:auto;padding:0 16px">ค้นหา</button></div>
    <div id="rdRes" class="hint">พิมพ์อย่างน้อย 2 ตัวอักษร แล้วติ๊กคนที่ต้องการลบ (ค้นหลายครั้งแล้วเลือกรวมกันได้)</div>
    <div id="rdPick" class="hint"></div>
    <div class="row" style="margin-top:12px"><button class="btn sec" id="rdX">ปิด</button><button class="btn bad" id="rdOk" disabled style="opacity:.5">ลบที่เลือก (0 คน)</button></div></div></div>`);
  const close = () => { const e = $('#rdSheet'); if (e) e.remove(); };
  const upd = () => {
    const n = picked.size, b = $('#rdOk');
    b.textContent = 'ลบที่เลือก (' + n + ' คน)'; b.disabled = !n; b.style.opacity = n ? 1 : .5;
    $('#rdPick').innerHTML = n ? 'เลือกแล้ว: ' + [...picked.values()].map(esc).join(', ') : '';
  };
  const search = async () => {
    const q = $('#rdQ').value.trim(); if (q.length < 2) return toast('พิมพ์อย่างน้อย 2 ตัวอักษร');
    const r = await run(() => api('rosterSearch', { q }));
    $('#rdRes').innerHTML = !r.list.length ? 'ไม่พบ "' + esc(q) + '"' :
      `<div class="small muted" style="margin:8px 0 2px">พบ ${r.found} คน${r.found > r.list.length ? ' (แสดง ' + r.list.length + ' คนแรก — พิมพ์ให้เจาะจงขึ้น)' : ''} <a href="javascript:void 0" id="rdAll">เลือกทั้งหมดในหน้านี้</a></div>` +
      r.list.map(x => `<label class="grpchk"><input type="checkbox" data-id="${esc(x.id)}" data-n="${esc(x.name)}"${picked.has(x.id) ? ' checked' : ''}><span>${esc(x.name)}<br><span class="small muted">${esc(x.dept || 'ไม่ระบุแผนก')}${x.bound ? ' · ผูก LINE แล้ว' : ''}</span></span></label>`).join('');
    app.querySelectorAll('#rdRes [data-id]').forEach(c => c.onchange = () => { if (c.checked) picked.set(c.dataset.id, c.dataset.n); else picked.delete(c.dataset.id); upd(); });
    const all = $('#rdAll'); if (all) all.onclick = () => { app.querySelectorAll('#rdRes [data-id]').forEach(c => { c.checked = true; picked.set(c.dataset.id, c.dataset.n); }); upd(); };
  };
  $('#rdGo').onclick = search; $('#rdQ').onkeydown = e => { if (e.key === 'Enter') search(); };
  $('#rdX').onclick = close; $('#rdSheet').onclick = e => { if (e.target.id === 'rdSheet') close(); };
  $('#rdQ').focus();
  $('#rdOk').onclick = () => confirmSheet('ลบ ' + picked.size + ' คนออกจากรายชื่อ?', 'คนที่ถูกลบ ถ้าเคยยืนยันตัวตนไว้ จะกลับเป็น "รอตรวจ" (ยังแจ้งซ่อมได้)', 'ลบ', async () => {
    const r = await run(() => api('rosterDelete', { ids: [...picked.keys()] }));
    close(); toast('ลบแล้ว ' + r.deleted + ' คน' + (r.backToPending ? ' · กลับเป็นรอตรวจ ' + r.backToPending + ' คน' : ''), 4000);
    CACHE.drop('vf'); CACHE.drop('ov'); pageVerify();
  });
}

/** จัดการหน่วยงาน (ชีต "หน่วยงาน"): ไล่ดูเป็นขั้น เพิ่ม / แก้ชื่อ / ซ่อน */
async function deptManager() {
  let list = [], at = '';
  app.insertAdjacentHTML('beforeend', `<div class="sheet" id="dmSheet"><div class="sbox" style="height:88vh;display:flex;flex-direction:column">
    <h2 style="margin-bottom:4px">จัดการหน่วยงาน</h2>
    <div class="hint" style="margin:0">รายการนี้ใช้ในดรอปดาวน์ตอนผู้แจ้งลงทะเบียน · แก้ชื่อแล้ว ชื่อหน่วยในรายชื่อบุคลากรและของผู้แจ้งจะเปลี่ยนตาม</div>
    <div id="dmCrumb" class="dpc"></div><div id="dmAdd"></div>
    <div id="dmL" style="flex:1;overflow:auto;margin:4px -4px 0;padding:0 4px"><div class="empty">กำลังโหลด...</div></div>
    <div class="row" style="margin-top:10px"><button class="btn sec" id="dmX">ปิด</button></div></div></div>`);
  const close = () => { const e = $('#dmSheet'); if (e) e.remove(); };
  $('#dmX').onclick = close; $('#dmSheet').onclick = e => { if (e.target.id === 'dmSheet') close(); };
  const load = async () => { list = (await run(() => api('deptList', {}))).list; draw(); };
  const depth = p => p ? p.split(' › ').length : 0;
  const draw = () => {
    const parts = at ? at.split(' › ') : [];
    $('#dmCrumb').innerHTML = `<a href="javascript:void 0" data-at="">ทั้งหมด</a>` + parts.map((x, i) => ` › <a href="javascript:void 0" data-at="${esc(parts.slice(0, i + 1).join(' › '))}">${esc(x)}</a>`).join('');
    app.querySelectorAll('#dmCrumb [data-at]').forEach(a => a.onclick = () => { at = a.dataset.at; draw(); });
    $('#dmAdd').innerHTML = depth(at) < 3 ? `<button class="btn sec sm" id="dmNew" style="width:auto;padding:8px 14px;margin:6px 0">➕ ${at ? 'เพิ่มหน่วยย่อยใน “' + esc(parts[parts.length - 1]) + '”' : 'เพิ่มสังกัดระดับบน'}</button>` : '<div class="hint">ระดับนี้เป็นระดับสุดท้าย (3 ระดับ)</div>';
    const nb = $('#dmNew'); if (nb) nb.onclick = () => {
      $('#dmAdd').innerHTML = `<div class="row" style="margin:6px 0"><input type="text" id="dmNewT" placeholder="ชื่อหน่วยงานใหม่"><button class="btn sm" id="dmNewOk" style="flex:none;width:auto;padding:0 16px">เพิ่ม</button></div>`;
      $('#dmNewT').focus();
      $('#dmNewOk').onclick = async () => { const name = $('#dmNewT').value.trim(); if (name.length < 2) return toast('กรุณาพิมพ์ชื่อ');
        await run(() => api('deptAdd', { parent: at, name })); toast('เพิ่มแล้ว'); CACHE.drop('init'); await load(); };
    };
    const kids = list.filter(x => x.segs.length === depth(at) + 1 && (!at || x.path.indexOf(at + ' › ') === 0)).sort((a, b) => a.segs[a.segs.length - 1].localeCompare(b.segs[b.segs.length - 1], 'th'));
    $('#dmL').innerHTML = kids.length ? kids.map(x => { const sub = list.filter(y => y.path.indexOf(x.path + ' › ') === 0 && y.segs.length === x.segs.length + 1).length;
      return `<div class="dmr${x.on ? '' : ' off'}" data-p="${esc(x.path)}">

          <span class="small muted">${x.n} คน${sub ? ' · ' + sub + ' หน่วยย่อย' : ''}</span>${depth(x.path) < 3 || sub ? '<i>›</i>' : ''}</div>

/** โหลดไลบรารีอ่าน/เขียน Excel เมื่อจำเป็นเท่านั้น */
let XLSX_P = null;
function loadXlsx() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  // ใช้ SheetJS รุ่นล่าสุดจากเว็บผู้พัฒนา (แก้ช่องโหว่ของรุ่นเก่าใน npm แล้ว) ถ้าโหลดไม่ได้ใช้สำรอง
  const SRC = ['https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js', 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'];
  const load = i => new Promise((ok, bad) => {
    const s = document.createElement('script'); s.src = SRC[i];
    s.onload = () => ok(window.XLSX); s.onerror = () => { s.remove(); if (i + 1 < SRC.length) load(i + 1).then(ok, bad); else bad(new Error('โหลดตัวอ่านไฟล์ Excel ไม่ได้ ตรวจอินเทอร์เน็ตแล้วลองใหม่')); };
    document.head.appendChild(s);
  });
  return XLSX_P || (XLSX_P = load(0).catch(e => { XLSX_P = null; throw e; }));
}
/** บันทึกไฟล์ให้ผู้ใช้ (ตั้งชื่อไฟล์ภาษาไทยได้แน่นอน) */
function saveBook(X, wb, name, type) {
  const buf = X.write(wb, { bookType: type, type: 'array' });
  const blob = new Blob([buf], { type: type === 'biff8' ? 'application/vnd.ms-excel' : 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

/** อ่านไฟล์ (HIP หรือฟอร์มของระบบ) → แสดงสรุปให้เลือกกลุ่ม → ส่งเข้าระบบ */
async function importRoster(file, exclude) {
  const X = await run(loadXlsx);
  let aoa;
  try {
    const wb = X.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
    const sh = wb.Sheets['รายชื่อบุคลากร'] || wb.Sheets[wb.SheetNames[0]];
    aoa = X.utils.sheet_to_json(sh, { header: 1, raw: false, defval: '' });
  } catch (e) { return toast('อ่านไฟล์ไม่ได้: ' + (e.message || e), 5000); }
  const hi = aoa.findIndex(row => row.some(c => /^(ชื่อผู้ใช้|ชื่อ-นามสกุล|ชื่อ)$/.test(String(c).trim())));
  if (hi < 0) return toast('ไม่พบหัวตาราง "ชื่อ" / "นามสกุล" หรือ "ชื่อผู้ใช้" — ใช้ไฟล์จาก HIP หรือฟอร์มของระบบเท่านั้น', 5000);
  const H = aoa[hi].map(c => String(c).trim()), col = re => H.findIndex(h => re.test(h));
  const hip = col(/ชื่อผู้ใช้/) >= 0;
  // ฟอร์มของระบบ: ชื่อ | นามสกุล แยกช่อง (ฟอร์มรุ่นแรกใช้ช่องเดียว "ชื่อ-นามสกุล" ก็ยังอ่านได้)
  const cF = hip ? col(/ชื่อผู้ใช้/) : col(/^(ชื่อ|ชื่อ-นามสกุล)$/), cL = hip ? -1 : col(/^นามสกุล$/);
  const cD = hip ? col(/^แผนก/) : col(/หน่วยงาน/), cE = col(/วันหมดอายุ/);
  const cellName = row => (String(row[cF] || '').trim() + (cL >= 0 ? ' ' + String(row[cL] || '').trim() : '')).trim();
  const exRe = exclude ? new RegExp(exclude) : null, today = new Date().toISOString().slice(0, 10);
  const LABEL = /ห้อง|หอพัก|ชั้น\s*\d|สำรอง|ทดสอบ|test|แขก|guest|visitor|ชั่วคราว|\d{3,}/i;
  // แผนกใน HIP เป็นลำดับชั้น "5.ภาควิชา...\5.3ภาควิชาพยาธิวิทยา" → "ภาควิชา... › ภาควิชาพยาธิวิทยา" (ผู้แจ้งกรอกชั้นไหนก็ตรง)
  const cleanDept = d => String(d || '').split('\\').map(x => x.replace(/^[\d.]+\s*/, '').trim()).filter(Boolean).join(' › ');
  const topDept = d => { const t = String(d || '').split('\\')[0].trim(); return t ? t.replace(/^[\d.]+\s*/, '') : '(ไม่ระบุแผนก)'; };
  const ok = [], out = { 'ห้องพัก/บัตรสำรอง/ไม่ใช่ชื่อคน': 0, 'นิสิต/ผู้มาติดต่อ': 0, 'บัตรหมดอายุ': 0 };
  aoa.slice(hi + 1).forEach(row => {
    const name = cellName(row); if (!name) return;
    const dept = cD >= 0 ? String(row[cD] || '').trim() : '';
    // ไฟล์ HIP มีแถวที่ไม่ใช่คน (ห้องพักนิสิต บัตรสำรอง) ปนอยู่ — ฟอร์มของระบบเชื่อตามที่กรอก
    if (!/[ก-๙a-z]/i.test(name) || (hip && (LABEL.test(name) || !/\s/.test(name.replace(/^(นางสาว|นาง|นาย)/, ''))))) { out['ห้องพัก/บัตรสำรอง/ไม่ใช่ชื่อคน']++; return; }
    if (exRe && exRe.test(dept)) { out['นิสิต/ผู้มาติดต่อ']++; return; }
    if (cE >= 0) { const e = row[cE] instanceof Date ? row[cE].toISOString().slice(0, 10) : String(row[cE]).slice(0, 10); if (/^\d{4}-\d{2}-\d{2}$/.test(e) && e < today) { out['บัตรหมดอายุ']++; return; } }
    ok.push({ name, dept: hip ? cleanDept(dept) : dept, grp: hip ? topDept(dept) : (dept || '(ไม่ระบุหน่วยงาน)') });
  });
  const total = aoa.length - hi - 1, groups = {};
  ok.forEach(x => { groups[x.grp] = (groups[x.grp] || 0) + 1; });
  const gk = Object.keys(groups).sort((a, b) => groups[b] - groups[a]);
  const exTxt = Object.keys(out).filter(k => out[k]).map(k => k + ' ' + out[k]).join(' · ');
  app.insertAdjacentHTML('beforeend', `<div class="sheet" id="impSheet"><div class="sbox" style="max-height:88vh;overflow:auto">
    <h2>นำเข้ารายชื่อบุคลากร</h2>
    <div class="hint">ไฟล์ ${esc(file.name)} · ${hip ? 'รูปแบบโปรแกรม HIP' : 'ฟอร์มของระบบ'} · ${total.toLocaleString()} แถว${exTxt ? '<br>ตัดออกอัตโนมัติ: ' + esc(exTxt) : ''}</div>
    <label class="f" style="margin-top:12px">เลือกกลุ่มที่นำเข้าเป็นบุคลากร</label>
    ${gk.map(g => `<label class="grpchk"><input type="checkbox" data-g="${esc(g)}" checked><span>${esc(g)}</span><b>${groups[g].toLocaleString()}</b></label>`).join('')}
    ${groups['(ไม่ระบุแผนก)'] ? '<div class="hint">"ไม่ระบุแผนก" อาจมีนิสิตหรืออดีตบุคลากรปนอยู่ และระบบเทียบได้แค่ชื่อ (ไม่มีหน่วยงานให้เทียบ) — ถ้าไม่แน่ใจให้เอาออก แล้วค่อยอนุญาตรายคน</div>' : ''}
    <div class="note warn" style="margin-top:12px">รายชื่อชุดนี้จะ <b>แทนที่</b> รายชื่อเดิมทั้งหมด (การผูกบัญชี LINE เดิมยังอยู่)</div>
    <div class="row"><button class="btn sec" id="impX">ยกเลิก</button><button class="btn" id="impOk">นำเข้า <span id="impN"></span> คน</button></div></div></div>`);
  const sel = () => { const on = new Set([...app.querySelectorAll('#impSheet [data-g]')].filter(c => c.checked).map(c => c.dataset.g)); return ok.filter(x => on.has(x.grp)); };
  const upd = () => { $('#impN').textContent = sel().length.toLocaleString(); };
  app.querySelectorAll('#impSheet [data-g]').forEach(c => c.onchange = upd); upd();
  const close = () => { const e = $('#impSheet'); if (e) e.remove(); };
  $('#impX').onclick = close;
  $('#impOk').onclick = async () => {
    const rows = sel().map(x => ({ name: x.name, dept: x.dept }));
    if (!rows.length) return toast('ยังไม่ได้เลือกกลุ่มใด');
    const res = await run(() => api('rosterImport', { rows, file: file.name, source: hip ? 'HIP' : 'ฟอร์ม', total, excluded: total - rows.length }));
    close(); toast('นำเข้า ' + res.n.toLocaleString() + ' คนแล้ว · ผู้แจ้งยืนยันแล้ว ' + res.verified + ' · รอตรวจ ' + res.pending, 5000);
    CACHE.drop('vf'); CACHE.drop('ov'); pageVerify();
  };
}

function drawCal(r, from) {

  if (!r.isAdmin || CAL_TECH === null) CAL_TECH = '';   // ช่างเห็นเฉพาะงานตัวเอง (เซิร์ฟเวอร์กรองให้) · ตัวกรองมีเฉพาะแอดมิน

  const keep = j => !CAL_TECH || j.tech_uid === CAL_TECH;

  const nowH = sel === r.today ? new Date(Date.now() + 7 * 36e5).getUTCHours() : -1;
  // เวลา | รหัส | เรื่อง (สถานที่ด้านล่าง) | ผู้แจ้ง | ช่าง | ผลการนัด (หมายเหตุด้านล่าง) — นัดไม่ตรงชั่วโมงแสดงนาทีไว้ใต้รหัส

  $('#c').innerHTML = `<div class="cal">${r.list.slice(0, 14).map(d => {
      const n = d.jobs.filter(keep).length;
      return `<button data-d="${d.iso}" class="${d.iso === sel ? 'on' : ''}"><span>${esc(d.dow)}</span><b>${esc(d.label.slice(0, 5))}</b><i>${n ? n + ' งาน' : '—'}</i></button>`;

function addDaysIso(iso, n) { const d = new Date(iso + 'T00:00:00+07:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }

  SND.month = month || ''; SND.lastMax = null;
  const tick = async () => {
    if (new URL(location.href).searchParams.get('p') !== 'dash') { clearInterval(SND.timer); SND.timer = null; return; }
    let r;
    try {
      if (SND.key && !MOCK) {   // ใช้กุญแจของหน้าภาพรวม — ถามต่อได้ 12 ชม. โดยไม่ต้องโหลดหน้าใหม่ (เสียงไม่ถูกปิด)
        const j = await (await fetch(CFG.GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'pulse', pulseKey: SND.key }) })).json();
        if (!j.ok) { SND.key = ''; throw new Error(j.error); }
        r = j;
      } else r = await api('pulse');
    } catch (e) { return; }
    const first = SND.lastMax === null, fresh = !first && r.maxNo > SND.lastMax && r.newCount > 0;
    const changed = SND.pulse && (SND.pulse.newCount !== r.newCount || SND.pulse.lateCount !== r.lateCount);
    SND.lastMax = Math.max(SND.lastMax || 0, r.maxNo); SND.pulse = r;
    if (SND.on && Date.now() >= SND.mute && r.lateCount) siren();
    else if (SND.on && fresh) chime();
    if (fresh) toast('🔔 มีงานแจ้งซ่อมใหม่เข้ามา', 5000);
    paintAlarm();
    if (fresh || changed) {   // ข้อมูลเปลี่ยน → วาดภาพรวมใหม่ (คงตำแหน่งเลื่อนเดิม)
      try { const o = await api('overview', { month: SND.month }); CACHE.set('ov' + SND.month, o); const y = window.scrollY; drawDash(o); window.scrollTo(0, y); } catch (e) { /* รอบหน้า */ }
    }
  };
  tick();
  SND.timer = setInterval(tick, 30000);
}
function dailyChart(daily, lastDay) {
  const W = Math.max(300, Math.min(1100, window.innerWidth - 60)), H = 190, pl = 26, pb = 22, n = daily.length, bw = (W - pl) / n;
  const mx = Math.max(2, ...daily.map(d => Math.max(d.in, d.done)));
  const y = v => H - pb - v * (H - pb - 10) / mx;
  const ticks = [...new Set([0, Math.ceil(mx / 2), mx])];
  let g = ticks.map(t => `<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="#E3E8EE"/><text x="${pl - 6}" y="${y(t) + 4}" font-size="11" text-anchor="end" fill="#6B7785">${t}</text>`).join('');
  const w1 = Math.max(2, Math.min(14, bw * .36));
  daily.forEach((d, i) => {
    const cx = pl + i * bw + bw / 2;
    if (lastDay && d.d > lastDay) { g += `<rect x="${pl + i * bw}" y="${8}" width="${bw}" height="${H - pb - 8}" fill="#F8F9FA"/>`; }
    if (d.in) g += `<rect x="${cx - w1 - 1}" y="${y(d.in)}" width="${w1}" height="${H - pb - y(d.in)}" rx="2" fill="#1C7ED6"><title>วันที่ ${d.d}: แจ้งเข้า ${d.in}</title></rect>`;
    if (d.done) g += `<rect x="${cx + 1}" y="${y(d.done)}" width="${w1}" height="${H - pb - y(d.done)}" rx="2" fill="#2F9E44"><title>วันที่ ${d.d}: ทำเสร็จ ${d.done}</title></rect>`;
    if (d.d === 1 || d.d % 5 === 0 || i === n - 1) g += `<text x="${cx}" y="${H - 6}" font-size="11" text-anchor="middle" fill="#6B7785">${d.d}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}</svg>`;
}

/* ================= boot ================= */
async function boot() {
  const fail = e => { busy(false); app.innerHTML = `<div class="wrap"><div class="card center"><h2>เปิดระบบไม่สำเร็จ</h2><p class="muted small">${esc(e.message || e)}</p><button class="btn" onclick="location.reload()">ลองใหม่</button></div></div>`; };
  // ปลุกเซิร์ฟเวอร์ให้ตื่นไปพร้อมกับตอน LINE กำลังล็อกอิน (Apps Script ครั้งแรกจะช้า)
  if (!MOCK && CFG.GAS_URL) { try { fetch(CFG.GAS_URL, { method: 'GET', mode: 'no-cors' }); } catch (e) {} }
  // เตรียม idToken เบื้องหลัง — หน้าจะวาดจากแคชได้เลยไม่ต้องรอ
  READY = (async () => {
    if (MOCK) { await new Promise(r => { const s = document.createElement('script'); s.src = 'mock.js'; s.onload = r; document.head.appendChild(s); }); return; }
    await liff.init({ liffId: CFG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); await new Promise(() => {}); }
    ID_TOKEN = liff.getIDToken();
  })();
  const cachedInit = MOCK ? null : CACHE.get('init');
  if (cachedInit) {                       // เปิดครั้งต่อไป: ขึ้นหน้าทันที
    INIT = cachedInit; route();
    try {
      INIT = await refreshInit();
      // คนละบัญชี/สิทธิ์เปลี่ยน → ล้างแคชแล้ววาดใหม่
      if (JSON.stringify(INIT.me) !== JSON.stringify(cachedInit.me)) { CACHE.drop(); CACHE.set('init', INIT); route(); }
    } catch (e) { /* ใช้ของเดิมไปก่อน */ }
    return;
  }
  busy(true);
  try { INIT = await refreshInit(); busy(false); route(); } catch (e) { fail(e); }
}
async function refreshInit() {
  const r = await api('init');
  CACHE.set('init', r);
  return r;
}
</script>
<script>
if (new URLSearchParams(location.search).get('mock') === '1') boot();
else { const s = document.createElement('script'); s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js'; s.onload = boot; s.onerror = () => { document.getElementById('app').innerHTML = '<p style="padding:20px">โหลด LINE SDK ไม่ได้ กรุณาเปิดจากแอป LINE</p>'; }; document.head.appendChild(s); }
</script>
