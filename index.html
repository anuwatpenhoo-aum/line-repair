<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบแจ้งซ่อม</title>
<style>
:root{
  --bg:#F4F6F8; --card:#FFFFFF; --ink:#1F2933; --muted:#6B7785; --line:#E3E8EE;
  --pri:#06A94D; --pri-ink:#FFFFFF; --pri-soft:#E6F7EE;
  --blue:#1C7ED6; --blue-soft:#E7F1FB; --warn:#E67700; --warn-soft:#FFF4E6;
  --bad:#C92A2A; --bad-soft:#FFF0F0; --violet:#7048E8;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Sarabun","Noto Sans Thai","Leelawadee UI",system-ui,sans-serif}
body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
.top h1{font-size:17px;margin:0;flex:1}
.top .back{border:0;background:none;font-size:22px;line-height:1;padding:2px 6px;color:var(--muted)}
.wrap{max-width:640px;margin:0 auto;padding:12px 12px 0}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--pri-soft);color:var(--pri);font-size:12px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
label.f b{color:var(--bad);font-weight:600}
input[type=text],input[type=tel],input[type=date],input[type=time],input[type=search],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:#FBFCFD;color:var(--ink)}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri-soft);border-color:var(--pri)}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:#FBFCFD;border-radius:999px;padding:8px 12px;font:inherit;font-size:14px;color:var(--ink)}
.chip.on{background:var(--pri-soft);border-color:var(--pri);color:#036B30;font-weight:600}
.grp{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;overflow:hidden}
.grp>.gh{padding:10px 12px;font-weight:600;font-size:14px;background:#FAFBFC;display:flex;gap:8px}
.grp>.gh .gn{color:var(--pri)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-top:1px solid var(--line);font-size:14px}
.chk input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--pri);flex:none}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.ph{width:78px;height:78px;border-radius:10px;background:#EEF1F4 center/cover;position:relative;border:1px solid var(--line)}
.ph button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#000A;color:#fff;font-size:13px}
.ph.add{display:grid;place-items:center;color:var(--muted);font-size:26px;border-style:dashed;cursor:pointer}
.sig{border:1.5px dashed #B8C2CC;border-radius:12px;background:#fff;position:relative;touch-action:none}
.sig canvas{display:block;width:100%;height:170px;border-radius:12px}
.sig .ph-t{position:absolute;inset:0;display:grid;place-items:center;color:#A0AAB4;pointer-events:none;font-size:14px}
.sig .clr{position:absolute;right:8px;top:8px;border:0;background:#F1F3F5;border-radius:8px;padding:4px 10px;font:inherit;font-size:13px;color:var(--muted)}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font:inherit;font-weight:700;font-size:16px;background:var(--pri);color:var(--pri-ink)}
.btn.sec{background:#EEF1F4;color:var(--ink)}
.btn.blue{background:var(--blue)}.btn.warn{background:var(--warn)}.btn.bad{background:var(--bad)}
.btn[disabled]{opacity:.55}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;border-radius:10px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bar .in{max-width:640px;margin:0 auto;display:flex;gap:10px}.bar .in>*{flex:1}
.consent{display:flex;gap:10px;font-size:13px;color:var(--muted);align-items:flex-start}
.consent input{width:20px;height:20px;accent-color:var(--pri);flex:none;margin-top:1px}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.s-new{background:var(--warn-soft);color:var(--warn)} .s-asg{background:var(--blue-soft);color:var(--blue)}
.s-pln{background:#F3F0FF;color:var(--violet)} .s-wa{background:#E6FCF5;color:#087F5B}
.s-rej{background:var(--bad-soft);color:var(--bad)} .s-pau{background:#FFF4E6;color:#A35200}
.ph.add{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:20px}
.ph.add span{font-size:11px;color:var(--muted)}
.stp{display:flex;gap:0;margin:2px 0 6px}
.stp .s{flex:1;text-align:center;position:relative;font-size:11px;color:var(--muted);line-height:1.25}
.stp .s i{display:block;width:22px;height:22px;border-radius:50%;margin:0 auto 5px;background:#E3E8EE;color:#fff;font-style:normal;font-size:12px;line-height:22px;position:relative;z-index:1}
.stp .s:before{content:'';position:absolute;top:11px;left:-50%;width:100%;height:3px;background:#E3E8EE}
.stp .s:first-child:before{display:none}
.stp .s.on i{background:var(--ok,#2B8A3E)} .stp .s.on:before{background:var(--ok,#2B8A3E)}
.stp .s.on{color:#1F2933;font-weight:600}
.stp .s.cur i{box-shadow:0 0 0 4px rgba(43,138,62,.15)}
.stp .s.warn i{background:#E67700} .stp .s.warn{color:#A35200}
.nowbox{background:#F1F8F3;border:1px solid #CFE8D6;border-radius:12px;padding:12px 14px;margin-top:8px}
.nowbox b{display:block;font-size:16px;color:#1B5E2A;margin-bottom:2px}
.foldh{display:flex;align-items:center;gap:10px;justify-content:space-between} .s-cls{background:#EEF1F4;color:#495057} .s-cxl{background:#F8F9FA;color:#ADB5BD}
.tk{display:block;background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(16,24,40,.05);color:inherit;text-decoration:none}
.tk .l1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tk .no{font-weight:700}
.tk .l2{font-size:14px;margin-top:4px}
.tk .l3{font-size:12.5px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.tk .od{color:var(--bad);font-weight:600}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line)}
.tl li{position:relative;padding:0 0 10px 8px;font-size:13.5px}
.tl li:before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--pri)}
.tl .ts{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.tab{border:0;background:#E9ECEF;border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;white-space:nowrap;color:var(--ink)}
.tab.on{background:var(--ink);color:#fff}
.tab i{font-style:normal;opacity:.7;margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:12px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:20px}.stat span{font-size:11.5px;color:var(--muted)}
.rate{display:flex;gap:6px}
.rate button{flex:1;border:1px solid var(--line);background:#FBFCFD;border-radius:10px;padding:8px 2px;font:inherit;font-size:12px;color:var(--ink)}
.rate button b{display:block;font-size:18px}
.rate button.on{background:var(--pri-soft);border-color:var(--pri);color:#036B30}
.seg{display:flex;gap:8px}.seg button{flex:1;border:1px solid var(--line);background:#FBFCFD;border-radius:10px;padding:10px 6px;font:inherit;font-size:14px;color:var(--ink)}
.seg button.on{background:var(--pri-soft);border-color:var(--pri);color:#036B30;font-weight:700}
.seg button.on.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.center{text-align:center}
.done-ic{width:72px;height:72px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-size:38px;margin:24px auto 10px}
.muted{color:var(--muted)} .small{font-size:13px}
.note{background:var(--blue-soft);color:#1864AB;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.sheet{position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end}
.sbox{background:var(--card);width:100%;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .18s ease-out}
.sbox h2{margin:0 0 6px;font-size:17px}
.seg button{white-space:nowrap}
.card.st.off{opacity:.62}
.imgs.big img{width:calc(50% - 4px);height:auto;max-height:260px;aspect-ratio:4/3}
.lb{position:fixed;inset:0;background:#000d;z-index:50;display:grid;place-items:center;padding:12px}.lb img{max-width:100%;max-height:100%;border-radius:8px}
.kbc{display:block;text-decoration:none;color:inherit}.kbc h3{margin:0 0 4px;font-size:16px}.kbc p{margin:0;color:var(--muted);font-size:13.5px}
.kbc .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;background:var(--pri-soft);color:var(--pri);font-size:12px;font-weight:600}
.tag.st{background:#FFF4E6;color:#A35200}
.kbbody{white-space:pre-wrap;line-height:1.75;font-size:15px}
.sec-h{font-size:14px;color:var(--muted);margin:16px 4px 8px;font-weight:600}
@keyframes up{from{transform:translateY(24px);opacity:.4}}
.srch{display:flex;gap:8px;margin-bottom:12px}.srch input{flex:1}
.cal{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.cal button{flex:none;min-width:58px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:8px 6px;text-align:center;font:inherit;color:var(--muted);line-height:1.35}
.cal button b{display:block;font-size:17px;color:var(--ink)}
.cal button.on{background:var(--pri);border-color:var(--pri);color:#fff}.cal button.on b{color:#fff}
.cal button i{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--pri)}
.cal button.on i{color:#CFE3FF}
.slot{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.slot .tm{flex:none;width:52px;font-weight:700;color:var(--pri)}
.slot .bd{flex:1;min-width:0}.slot .bd .t2{font-size:13px;color:var(--muted)}
.note.warn{background:var(--warn-soft);color:#A35200}
.empty{text-align:center;color:var(--muted);padding:36px 0}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#212529;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.loading{position:fixed;inset:0;background:#fff9;display:grid;place-items:center;z-index:30}
.spin{width:36px;height:36px;border:4px solid var(--pri-soft);border-top-color:var(--pri);border-radius:50%;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.imgs{display:flex;gap:8px;flex-wrap:wrap}.imgs img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.imgs img.lz,.imgs img.lzw{background:var(--pri-soft) linear-gradient(100deg,#0000 30%,#fff8 50%,#0000 70%) 0 0/300% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{to{background-position:-150% 0}}
#upd{position:fixed;top:0;left:0;right:0;height:3px;z-index:40;background:linear-gradient(90deg,var(--pri-soft),var(--pri),var(--pri-soft));background-size:220% 100%;animation:ld 1s linear infinite}
@keyframes ld{to{background-position:-220% 0}}
.hr{height:1px;background:var(--line);margin:12px 0}
.hidden{display:none!important}

.dwrap{max-width:1180px;margin:0 auto;padding:12px 12px 0}
.dgrid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:900px){.dgrid{grid-template-columns:1fr 1fr}.dgrid .wide{grid-column:1/-1}.kpis{grid-template-columns:repeat(5,1fr)!important}}
.dgrid .card{margin:0}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:0 1px 2px rgba(16,24,40,.05)}
.kpi .lb{font-size:13px;color:var(--muted)} .kpi .v{font-size:28px;font-weight:700;line-height:1.2}
.kpi .dl{font-size:12.5px} .up{color:#2B8A3E} .dn{color:var(--bad)} .nt{color:var(--muted)}
.dhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.dhead select{width:auto;flex:1;min-width:180px;max-width:280px}
.fchips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.fchip{border:0;border-radius:10px;padding:8px 12px;font:inherit;font-size:14px;font-weight:600}
.fchip b{font-size:18px;margin-left:6px}
.fchip.on{outline:2px solid var(--ink)}
.flist a{display:flex;justify-content:space-between;gap:8px;padding:9px 2px;border-top:1px solid var(--line);color:inherit;text-decoration:none;font-size:14px}
.flist a span:last-child{color:var(--muted);white-space:nowrap;font-size:13px}
.hbar{display:grid;grid-template-columns:minmax(90px,38%) 1fr 34px;gap:8px;align-items:center;font-size:13.5px;margin:6px 0}
.hbar .tr{background:#EEF1F4;border-radius:6px;height:14px;overflow:hidden}.hbar .fl{height:100%;border-radius:6px}
.hbar .n{text-align:right;font-weight:700}
table.tt{width:100%;border-collapse:collapse;font-size:14px}
table.tt th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:center;padding:6px 4px;border-bottom:1px solid var(--line)}
table.tt td{text-align:center;padding:8px 4px;border-bottom:1px solid var(--line)} table.tt td:first-child,table.tt th:first-child{text-align:left}
.rlist a{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none;font-size:14px}
.rlist .kd{font-size:11px;font-weight:700;border-radius:6px;padding:1px 7px;color:#fff;background:#2A6BD8}.rlist .kd.pdf{background:#C92A2A}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);margin-top:4px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
</style>

<body>
<div id="app"></div>
<div id="loading" class="loading hidden"><div class="spin"></div></div>

<script src="config.js"></script>
<script>
/* ================= core ================= */
const CFG = window.APP_CONFIG || {};
const Q = new URLSearchParams(location.search);
const MOCK = Q.get('mock') === '1';
let ID_TOKEN = null, INIT = null, PROFILE = null;
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const busy = on => $('#loading').classList.toggle('hidden', !on);
function toast(msg, ms) { const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms || 2600); }
const LS = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

let READY = null;                      // พร้อมยิง API เมื่อ LIFF ให้ idToken แล้ว
async function api(action, data) {
  if (READY) await READY;
  if (MOCK) return window.mockApi(action, data || {});
  const res = await fetch(CFG.GAS_URL, { method: 'POST', body: JSON.stringify({ action, idToken: ID_TOKEN, data: data || {} }) });
  const j = await res.json();
  if (!j.ok) {
    if (j.error === 'SESSION_EXPIRED') { liff.logout && liff.logout(); location.reload(); }
    throw new Error(j.error || 'เกิดข้อผิดพลาด');
  }
  return j;
}
async function run(fn) { busy(true); try { return await fn(); } catch (e) { toast(e.message || String(e), 4000); throw e; } finally { busy(false); } }

/* ---- แคชในเครื่อง: วาดของเดิมทันที แล้วค่อยอัปเดตเบื้องหลัง ---- */
const CK = 'rq1_';
const CACHE = {
  get(k) { return LS.get(CK + k, null); },
  set(k, v) { LS.set(CK + k, v); },
  drop(pre) { try { Object.keys(localStorage).forEach(k => { if (k.indexOf(CK + (pre || '')) === 0) localStorage.removeItem(k); }); } catch (e) {} }
};
let NAV = 0;                            // กันข้อมูลที่มาช้าทับหน้าใหม่
/** วาดจากแคชก่อน (ถ้ามี) แล้วดึงของจริงมาวาดทับ */
/** เก็บใบงานที่มาพร้อมรายการ ลงแคชรายใบ → กดเข้าไปดูขึ้นทันที */
function prime(r, isReporter, me) {
  (r.tickets || []).forEach(t => {
    if (t.item_ids === undefined) return;         // มาแบบย่อ ยังต้องดึงเพิ่ม
    CACHE.set('t' + t.no, { ticket: t, isReporter: isReporter, canWork: !isReporter && !!me && (me.role === 'admin' || t.assigned_uid === me.uid) });
  });
}
async function swr(key, call, render) {
  const my = ++NAV, old = CACHE.get(key);
  if (old) { render(old, true); mark(true); } else busy(true);
  try {
    const fresh = await call();
    CACHE.set(key, fresh);
    if (my === NAV) render(fresh, false);
  } catch (e) {
    if (my === NAV && !old) { app.innerHTML += `<div class="wrap"><div class="note warn">${esc(e.message || e)}</div></div>`; }
    else if (my === NAV) toast(e.message || String(e), 4000);
  } finally { if (my === NAV) { busy(false); mark(false); } }
}
/** แถบบางๆ บอกว่ากำลังอัปเดตข้อมูลอยู่ (ไม่บังหน้าจอ) */
function mark(on) {
  let b = $('#upd');
  if (on) { if (!b) { b = document.createElement('div'); b.id = 'upd'; document.body.appendChild(b); } }
  else if (b) b.remove();
}

/* ---- รูปภาพ: โหลดหลังวาดหน้าเสร็จ ---- */
const PHOTOS = {};
function imgsHtml(no, ids, kb) {
  if (!ids || !ids.length) return '';
  return '<div class="imgs' + (kb ? ' big' : '') + '">' + ids.map(id => PHOTOS[id]
    ? `<img src="${PHOTOS[id]}">`
    : `<img class="lz" ${kb ? 'data-kb' : 'data-no'}="${esc(no)}" data-p="${esc(id)}">`).join('') + '</div>';
}
function loadPhotos() {
  app.querySelectorAll('img.lz').forEach(async el => {
    const id = el.dataset.p;
    el.classList.remove('lz'); el.classList.add('lzw');
    try {
      const r = PHOTOS[id] ? { src: PHOTOS[id] }
        : el.dataset.kb ? await api('kbPhoto', { id: el.dataset.kb, pid: id }) : await api('photo', { no: el.dataset.no, id: id });
      if (r.src) { PHOTOS[id] = r.src; el.src = r.src; el.classList.remove('lzw'); }
    } catch (e) { el.remove(); }
  });
}
// แตะรูปเพื่อดูเต็มจอ (รูปขั้นตอน/หน้าจอ ต้องอ่านตัวหนังสือได้)
document.addEventListener('click', e => {
  const im = e.target.closest && e.target.closest('.imgs img');
  if (im && im.src) { const v = document.createElement('div'); v.className = 'lb'; v.innerHTML = '<img src="' + im.src + '">'; v.onclick = () => v.remove(); document.body.appendChild(v); }
});

function statusCls(s) {

/* ============ image & signature helpers ============ */
function compressImage(file, max, q) {
  return new Promise((resolve, reject) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, (max || 1280) / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', q || 0.72));
    };
    img.onerror = () => reject(new Error('อ่านไฟล์รูปไม่ได้'));
    img.src = url;
  });
}
function photoPicker(el, max) {
  const st = { list: [] };
  const mk = capture => {
    const i = document.createElement('input');
    i.type = 'file'; i.accept = 'image/*'; i.className = 'hidden';
    if (capture) i.setAttribute('capture', 'environment'); else i.multiple = true;
    i.onchange = async () => {
      for (const f of Array.from(i.files).slice(0, max - st.list.length)) { try { st.list.push(await compressImage(f)); } catch (e) { toast(e.message); } }
      i.value = ''; draw();
    };
    el.after(i); return i;
  };
  const cam = mk(true), gal = mk(false);
  const draw = () => {
    el.innerHTML = st.list.map((d, i) => `<div class="ph" style="background-image:url(${d})"><button type="button" data-i="${i}">✕</button></div>`).join('') +
      (st.list.length < max ? '<div class="ph add cam">📷<span>ถ่ายภาพ</span></div><div class="ph add gal">🖼<span>เลือกรูป</span></div>' : '');
    el.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => { st.list.splice(+b.dataset.i, 1); draw(); });
    const c = el.querySelector('.cam'); if (c) c.onclick = () => cam.click();
    const g = el.querySelector('.gal'); if (g) g.onclick = () => gal.click();
  };
  draw(); return st;
}
function signaturePad(box) {
  box.innerHTML = '<canvas></canvas><div class="ph-t">เซ็นชื่อในกรอบนี้</div><button type="button" class="clr">ล้าง</button>';
  const cv = box.querySelector('canvas'), hint = box.querySelector('.ph-t'), ctx = cv.getContext('2d');
  let drawing = false, empty = true, last = null, minX = 1e9, minY = 1e9, maxX = 0, maxY = 0;
  const size = () => { const r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; ctx.scale(d, d); ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#0B2E6B'; };
  size();
  const pos = e => { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cv.addEventListener('pointerdown', e => { drawing = true; last = pos(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); });
  cv.addEventListener('pointermove', e => {
    if (!drawing) return; const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p;
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y); maxX = Math.max(maxX, p.x); maxY = Math.max(maxY, p.y);
    if (empty) { empty = false; hint.classList.add('hidden'); }
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => cv.addEventListener(t, () => { drawing = false; }));
  box.querySelector('.clr').onclick = () => { ctx.clearRect(0, 0, cv.width, cv.height); empty = true; hint.classList.remove('hidden'); minX = minY = 1e9; maxX = maxY = 0; };
  return {
    isEmpty: () => empty || (maxX - minX < 15 && maxY - minY < 15),
    toDataURL() {
      const d = window.devicePixelRatio || 1, pad = 8;
      const x = Math.max(0, (minX - pad) * d), y = Math.max(0, (minY - pad) * d);
      const w = Math.min(cv.width - x, (maxX - minX + pad * 2) * d), h = Math.min(cv.height - y, (maxY - minY + pad * 2) * d);
      const o = document.createElement('canvas'); o.width = w; o.height = h; o.getContext('2d').drawImage(cv, x, y, w, h, 0, 0, w, h);
      return o.toDataURL('image/png');
    }
  };
}

      ${t.after_photos && t.after_photos.length ? '<label class="f">รูปหลังดำเนินการ</label>' + imgsHtml(t.no, t.after_photos) : ''}</div>` : ''}
    ${t.accept_result ? `<div class="card"><h2>การตรวจงาน</h2>${dl([['ผล', t.accept_result === 'แล้วเสร็จ' ? 'ผ่าน' : 'ส่งกลับแก้ไข'], ['เหตุผล', t.accept_reason], ['คะแนน', t.rating ? t.rating + ' / 5' : ''], ['ผู้ลงนาม', t.signer_name], ['เมื่อ', t.accepted]])}</div>` : ''}
    ${showTimeline ? `<div class="card"><h2>ประวัติการดำเนินการ</h2><ul class="tl">${(t.timeline || []).map(l => `<li><div>${esc(l.action)}${l.by ? ' · ' + esc(l.by) : ''}</div><div class="ts">${esc(l.ts)}</div></li>`).join('')}</ul></div>` : ''}`;
}
const STEPS = [
  { k: 'new', label: 'รับแจ้ง' }, { k: 'asg', label: 'มอบหมายช่าง' }, { k: 'pln', label: 'นัดหมาย' },
  { k: 'fix', label: 'ดำเนินการซ่อม' }, { k: 'chk', label: 'ตรวจงาน' }, { k: 'cls', label: 'ปิดงาน' }
];
function stepIndex(t) {
  return { 'รอมอบหมาย': 0, 'มอบหมายแล้ว': 1, 'นัดหมายแล้ว': 2, 'พักงาน': 3, 'ส่งกลับแก้ไข': 3, 'รอตรวจงาน': 4, 'ดำเนินการเสร็จสิ้น': 5, 'ยกเลิก': 5 }[t.status] || 0;
}
/** ข้อความบอกสถานะปัจจุบันแบบเข้าใจง่ายสำหรับผู้แจ้ง */
function nowText(t) {
  switch (t.status) {
    case 'รอมอบหมาย': return ['รับเรื่องแล้ว กำลังจัดช่าง', 'เจ้าหน้าที่จะแจ้งวันนัดเข้าดำเนินการให้ทราบ'];
    case 'มอบหมายแล้ว': return ['มอบหมายช่างแล้ว', 'ช่างผู้รับผิดชอบ: ' + (t.assigned_name || '-')];
    case 'นัดหมายแล้ว': return t.resched
      ? ['ส่งคำขอเลื่อนนัดแล้ว รอช่างยืนยัน', 'คุณขอเป็น ' + t.resched_when + ' · นัดเดิม ' + (t.appoint || '-')]
      : ['นัดเข้าดำเนินการ ' + (t.appoint || '-'), 'ช่าง: ' + (t.assigned_name || '-') + (t.acked ? '' : ' · กรุณากดรับทราบนัดหมาย')];
    case 'พักงาน': return ['พักงานชั่วคราว: ' + (t.pause_reason || '-'), 'ช่าง: ' + (t.assigned_name || '-') + ' · จะแจ้งอีกครั้งเมื่อดำเนินการต่อ'];
    case 'ส่งกลับแก้ไข': return ['ช่างกำลังแก้ไขงานให้', 'ช่าง: ' + (t.assigned_name || '-') + ' · กำหนดแก้เสร็จ ' + (t.due || '-')];
    case 'รอตรวจงาน': return ['ช่างดำเนินการเสร็จแล้ว', 'กรุณาตรวจงานและให้คะแนน'];
    case 'ดำเนินการเสร็จสิ้น': return ['ปิดงานเรียบร้อย ขอบคุณที่ใช้บริการ', 'ตรวจรับเมื่อ ' + (t.accepted || '-')];
    case 'ยกเลิก': return ['ใบแจ้งซ่อมนี้ถูกยกเลิก', ''];

function stepperHtml(t) {
  const i = stepIndex(t), warn = ['พักงาน', 'ส่งกลับแก้ไข', 'ยกเลิก'].indexOf(t.status) >= 0;
  const now = nowText(t);
  return `<div class="card"><div class="l1" style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">ใบแจ้งซ่อม #${t.no}</h2>${badge(t.status)}</div>
    <div class="hr"></div>
    <div class="stp">${STEPS.map((x, n) => `<div class="s${n <= i ? ' on' : ''}${n === i ? ' cur' : ''}${n === i && warn ? ' warn' : ''}"><i>${n < i ? '✓' : n + 1}</i>${x.label}</div>`).join('')}</div>
    <div class="nowbox"><b>${esc(now[0])}</b>${now[1] ? '<span class="small">' + esc(now[1]) + '</span>' : ''}</div>
    ${t.due && ['ดำเนินการเสร็จสิ้น', 'ยกเลิก'].indexOf(t.status) < 0 ? `<div class="hint">กำหนดแล้วเสร็จ ${esc(t.due)}${t.overdue ? ' (เกินกำหนด)' : ''}</div>` : ''}</div>`;
}
/** หน้าสำหรับผู้แจ้ง: เห็นสถานะ ข้อมูลที่แจ้ง และผลตรวจรับ (ไม่ต้องเห็นประวัติหลังบ้าน) */
function reporterViewHtml(t) {
  const dl = rows => '<dl class="kv">' + rows.filter(r => r[1] !== undefined && r[1] !== null && r[1] !== '').map(r => `<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('') + '</dl>';
  return stepperHtml(t) +
    `<div class="card"><h2>เรื่องที่แจ้ง</h2>${dl([['วันที่แจ้ง', t.created],

      ${t.photos && t.photos.length ? '<label class="f">รูปที่แนบ</label>' + imgsHtml(t.no, t.photos) : ''}</div>` +
    (t.done ? `<div class="card"><h2>ผลการซ่อม</h2>${dl([['ช่างผู้ปฏิบัติงาน', t.assigned_name], ['วันที่เสร็จ', t.done], ['สาเหตุที่พบ', t.cause], ['การแก้ไข', t.solution], ['คำแนะนำ', t.advice]])}

      ['คะแนนที่ให้', t.rating ? '★'.repeat(t.rating) + '☆'.repeat(5 - t.rating) + '  (' + t.rating + '/5)' : ''], ['ผู้ลงนาม', t.signer_name], ['เมื่อ', t.accepted]])}
      ${t.pdf_url ? `<a class="btn sec" style="text-align:center;text-decoration:none;display:block" href="${t.pdf_url}" target="_blank">📄 เปิดใบแจ้งซ่อม PDF</a>` : ''}</div>` : '');

async function pageTicket(no) {
  app.innerHTML = topBar('ติดตามงาน #' + no, 'mine') + '<div class="wrap" id="d"><div class="empty">กำลังโหลด...</div></div><div class="bar hidden" id="bar"><div class="in" id="barIn"></div></div>';
  await swr('t' + no, () => api('getTicket', { no }), r => {
    const t = r.ticket;

    const btns = [];

    if (r.isReporter && ['นัดหมายแล้ว', 'พักงาน'].indexOf(t.status) >= 0) btns.push(`<button class="btn sec" id="resched">${t.resched ? 'แก้ไขคำขอเลื่อนนัด' : 'ขอเลื่อนนัด'}</button>`);
    if (r.isReporter && t.status === 'รอตรวจงาน') btns.push(`<button class="btn" onclick="go('accept','${t.no}')">ตรวจงาน (ผ่าน / แก้ไข)</button>`);

/** ผู้แจ้งเสนอวัน-เวลาใหม่ */
function askReschedule(t) {
  const today = new Date(Date.now() + 7 * 36e5).toISOString().slice(0, 10);
  app.insertAdjacentHTML('beforeend', `<div class="sheet" id="rsSheet"><div class="sbox">
    <h2>ขอเลื่อนนัด #${t.no}</h2>
    <div class="hint">นัดเดิม ${esc(t.appoint || '-')} · เลือกวัน-เวลาที่คุณสะดวก ช่างจะยืนยันกลับมาอีกครั้ง</div>
    <div class="row"><div><label class="f">วันที่สะดวก <b>*</b></label><input type="date" id="rsD" min="${today}" value="${esc(t.resched_iso || t.appoint_iso || today)}"></div>
    <div><label class="f">เวลา <b>*</b></label><input type="time" id="rsT" value="${esc(t.resched_time || t.appoint_time || '09:00')}"></div></div>
    <label class="f">เหตุผล / หมายเหตุ</label><textarea id="rsN" placeholder="เช่น ติดประชุมทั้งเช้า สะดวกช่วงบ่าย">${esc(t.resched_note || '')}</textarea>
    <div class="row" style="margin-top:12px"><button class="btn sec" id="rsX">ยกเลิก</button><button class="btn" id="rsOk">ส่งคำขอ</button></div>
  </div></div>`);
  const close = () => { const e = $('#rsSheet'); if (e) e.remove(); };
  $('#rsX').onclick = close;
  $('#rsSheet').onclick = e => { if (e.target.id === 'rsSheet') close(); };
  $('#rsOk').onclick = async () => {
    const d = { no: t.no, date: $('#rsD').value, time: $('#rsT').value, note: $('#rsN').value.trim() };
    if (!d.date || !d.time) return toast('กรุณาเลือกวันและเวลาที่สะดวก');
    await run(() => api('reschedule', d));
    close(); refresh('t' + t.no, 'mine', 'staff'); CACHE.drop('ov'); CACHE.drop('sc');
    toast('ส่งคำขอเลื่อนนัดแล้ว รอช่างยืนยัน'); pageTicket(t.no);
  };
}
/** ลบแคชที่ล้าสมัยหลังจากมีการเปลี่ยนแปลงข้อมูล */
function refresh() { Array.prototype.forEach.call(arguments, k => { try { localStorage.removeItem(CK + k); } catch (e) {} }); }

/* ---------- 4) ตรวจรับงาน + ลายเซ็น ---------- */
async function pageAccept(no) {
  const onsite = new URL(location.href).searchParams.get('onsite') === '1';
  app.innerHTML = topBar('ตรวจงาน #' + no, onsite ? 'staff' : 'mine') + '<div class="wrap" id="d"><div class="empty">กำลังโหลด...</div></div>';
  let drawn = '';
  await swr('t' + no, () => api('getTicket', { no }), r => {
    const sig = [r.ticket.status, r.ticket.cause, r.ticket.solution, (r.ticket.after_photos || []).join()].join('|');
    if (sig === drawn) return;            // ข้อมูลเหมือนเดิม ไม่ต้องวาดใหม่ (กันลายเซ็นที่เซ็นค้างไว้หาย)

  });
}
function drawAccept(r, no, onsite) {

  const ratings = [[5, 'ดีมาก'], [4, 'ดี'], [3, 'พอใช้'], [2, 'ปรับปรุง'], [1, 'ปรับปรุงเร่งด่วน']];

    <div class="card"><h2>งานที่ดำเนินการ</h2><dl class="kv"><dt>รายการ</dt><dd>${esc(t.items_text)}</dd><dt>สาเหตุที่พบ</dt><dd>${esc(t.cause)}</dd>
      <dt>การแก้ไข</dt><dd>${esc(t.solution)}</dd>${t.advice ? `<dt>คำแนะนำ</dt><dd>${esc(t.advice)}</dd>` : ''}<dt>ช่าง</dt><dd>${esc(t.assigned_name)}</dd><dt>วันที่เสร็จ</dt><dd>${esc(t.done)}</dd></dl>
      ${t.after_photos && t.after_photos.length ? '<label class="f">รูปหลังดำเนินการ</label>' + imgsHtml(t.no, t.after_photos) : ''}</div>
    <div class="card"><h2>ภาควิชา/หน่วยงาน พิจารณาแล้ว เห็นว่างานที่ได้รับมอบหมาย</h2>
      <div class="seg"><button type="button" class="on" data-r="pass">✓ ผ่าน</button><button type="button" data-r="fail">✎ แก้ไข</button></div>
      <div id="rsBox" class="hidden"><label class="f">สิ่งที่ต้องแก้ไข <b>*</b></label><textarea id="reason" placeholder="ระบุสิ่งที่ยังไม่เรียบร้อย ช่างจะแก้ไขภายใน ${INIT.slaDays} วัน"></textarea></div>
      <label class="f" style="margin-top:14px">ผู้รับบริการประเมินผู้ปฏิบัติงาน <b>*</b></label>
      <div class="rate">${ratings.map(x => `<button type="button" data-v="${x[0]}"><b>${x[0]}</b>${x[1]}</button>`).join('')}</div></div>
    <div class="card"><h2>ลงนาม</h2><label class="f">ชื่อผู้ลงนาม (ผู้แจ้ง/ผู้อยู่หน้างาน) <b>*</b></label>

/* ---------- 5) เจ้าหน้าที่ ---------- */

  $('#s').innerHTML = `${!me.hasSignature ? `<div class="note warn">ยังไม่ได้บันทึกลายเซ็นช่าง (ใช้ในใบแจ้งซ่อม) <a href="javascript:void 0" onclick="go('mysig')"><b>บันทึกตอนนี้</b></a></div>` : ''}

    <div class="row" style="margin-bottom:10px"><button class="btn sec sm" onclick="go('cal')">🗓 ตารางงาน</button><button class="btn sec sm" onclick="go('search')">🔍 ค้นประวัติ</button><button class="btn sec sm" onclick="go('kb')">📚 คลังความรู้</button></div>

async function pageJob(no) {
  app.innerHTML = topBar('งาน #' + no, 'staff') + '<div class="wrap" id="d"><div class="empty">กำลังโหลด...</div></div>';
  if (!STAFF) STAFF = CACHE.get('staff');
  const my = ++NAV, cached = CACHE.get('t' + no);
  let drawn = '';
  const draw = (r, s) => {
    const sg = JSON.stringify(Object.assign({}, r.ticket, { timeline: 0 }));
    if (sg === drawn) return;
    drawn = sg; drawJob(r, s, no);
  };
  if (cached && STAFF) { draw(cached, STAFF); mark(true); } else busy(true);
  try {
    const [r, s] = await Promise.all([api('getTicket', { no }), STAFF ? Promise.resolve(STAFF) : api('staffTickets')]);
    CACHE.set('t' + no, r); if (!STAFF) CACHE.set('staff', s);
    STAFF = s;
    if (my === NAV) draw(r, s);
  } catch (e) {
    if (my === NAV && !(cached && STAFF)) $('#d').innerHTML = `<div class="note warn">${esc(e.message || e)}</div>`;
    else if (my === NAV) toast(e.message || String(e), 4000);
  } finally { if (my === NAV) { busy(false); mark(false); } }
}

      ${t.status === 'ส่งกลับแก้ไข' ? `<div class="note warn">ผู้แจ้งขอให้แก้ไข: ${esc(t.accept_reason)} · ต้องแก้เสร็จภายใน ${esc(t.due)}</div>` : ''}

      <button class="btn sec" id="doneLine">เสร็จแล้ว · ส่งให้ผู้แจ้งตรวจงานทาง LINE</button></div>`);

      <div style="height:8px"></div><button class="btn sec" id="resend">ส่งคำขอตรวจงานทาง LINE อีกครั้ง</button></div>`);

  $('#d').innerHTML = sections.join('') + ticketDetailHtml(t, true);
  loadPhotos();

  const stale = () => { STAFF = null; refresh('t' + no, 'staff', 'mine'); CACHE.drop('ov'); };
  const on = (id, fn) => { const el = $('#' + id); if (el) el.onclick = fn; };
  on('assign', async () => { const uid = $('#tech').value; if (!uid) return toast('เลือกช่าง'); await run(() => api('assign', { no, uid })); toast('มอบหมายแล้ว'); stale(); pageJob(no); });

  const pick = id => { const v = $('#' + id).value; return v === '__other' ? $('#' + id + '_o').value.trim() : v; };
  on('pause', async () => { const reason = pick('pr'); if (!reason) return toast('กรุณาเลือกเหตุผล'); await run(() => api('pause', { no, reason })); toast('พักงานแล้ว'); stale(); pageJob(no); });

  on('take', async () => { await run(() => api('take', { no })); toast('รับงานแล้ว'); stale(); pageJob(no); });
  const planSel = $('#plan'); if (planSel) planSel.onchange = () => $('#daysBox').classList.toggle('hidden', !['wait', 'external'].includes(planSel.value));
  on('savePlan', async () => {
    const d = { no, appoint_date: $('#appoint').value, appoint_time: $('#appointT').value, plan_note: $('#pnote').value.trim() };
    if (!d.appoint_date || !d.appoint_time) return toast('กรุณาระบุวันนัดและเวลา');
    if (clashNo) return toast('เวลานี้ชนกับนัดงาน #' + clashNo + ' กรุณาเลือกเวลาอื่น');
    await run(() => api('plan', d)); toast('บันทึกและแจ้งผู้แจ้งแล้ว'); stale(); refresh('sc'); pageJob(no);
  });
  // เตือนเมื่อนัดชนกับงานอื่นของช่างคนเดียวกัน (ดูจากรายการงานที่โหลดมาแล้ว)
  const toMin = hm => { const m = String(hm || '').match(/^(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null; };
  const gap = Math.max(1, Number(INIT.appointGap == null ? 60 : INIT.appointGap));
  let clashNo = null;
  const chk = () => {
    const box = $('#clash'), btn = $('#savePlan'); if (!box) return;
    const dt = $('#appoint').value, tm = toMin($('#appointT').value);
    const booked = (s.tickets || []).filter(x => x.no != no && x.assigned_uid && x.assigned_uid === (t.assigned_uid || me.uid)
      && x.appoint_iso === dt && ['นัดหมายแล้ว', 'พักงาน', 'ส่งกลับแก้ไข'].indexOf(x.status) >= 0 && toMin(x.appoint_time) !== null)
      .sort((a, b) => toMin(a.appoint_time) - toMin(b.appoint_time));
    const hit = tm === null ? null : booked.find(x => Math.abs(toMin(x.appoint_time) - tm) < gap);
    clashNo = hit ? hit.no : null;
    if (!booked.length) { box.className = 'hidden'; box.innerHTML = ''; }
    else {
      box.className = hit ? 'note warn' : 'note';
      box.innerHTML = (hit ? `<b>⚠ ชนกับนัดงาน #${hit.no} เวลา ${esc(hit.appoint_time)} น.</b><br>นัดของช่างคนเดียวกันต้องห่างกันอย่างน้อย ${gap} นาที กรุณาเลือกเวลาอื่น<br>` : '') +
        'นัดที่มีแล้ววันนี้: ' + booked.map(x => `${esc(x.appoint_time)} น. (#${x.no})`).join(' · ');
    }
    if (btn) { btn.disabled = !!hit; btn.style.opacity = hit ? .5 : 1; }
  };
  ['appoint', 'appointT'].forEach(id => { const e = $('#' + id); if (e) { e.onchange = chk; e.oninput = chk; } });
  chk();
  let cat = t.category || '';
  app.querySelectorAll('#cat .chip').forEach(c => c.onclick = () => { cat = c.dataset.c; app.querySelectorAll('#cat .chip').forEach(x => x.classList.toggle('on', x === c)); });
  const aph = $('#aph') ? photoPicker($('#aph'), 3) : null;
  const complete = async onsite => {
    if (!me.hasSignature) { toast('กรุณาบันทึกลายเซ็นช่างก่อน'); return go('mysig'); }
    const pl = $('#plan');
    const d = { no, onsite, cause: pick('cause'), solution: pick('sol'), advice: $('#adv').value.trim(), asset_code: $('#asset').value.trim(), category: cat, after_photos: aph ? aph.list : [],
      plan: pl ? pl.value : '', plan_days: $('#days') ? $('#days').value : '' };
    if (!d.cause || !d.solution || !d.category) return toast('กรุณากรอกสาเหตุ แนวทางแก้ไข และประเภท');
    if (!d.asset_code) { toast('กรุณากรอกรหัสครุภัณฑ์ (งานที่ไม่มีครุภัณฑ์ ใส่ -)'); const a = $('#asset'); a.focus(); a.scrollIntoView({ block: 'center' }); return; }
    await run(() => api('complete', d)); stale();
    if (onsite) go('accept', no, { onsite: 1 }); else { toast('ส่งคำขอตรวจงานให้ผู้แจ้งแล้ว'); pageJob(no); }
  };
  on('doneOnsite', () => complete(true));
  on('doneLine', () => complete(false));
  on('resend', async () => { await run(() => api('requestAccept', { no })); toast('ส่งแล้ว'); });
  on('cxl', async () => { const reason = prompt('เหตุผลการยกเลิก'); if (!reason) return; await run(() => api('cancel', { no, reason })); toast('ยกเลิกแล้ว'); stale(); pageJob(no); });
}

let CAL_VIEW = LS.get('calView', 'week'), CAL_TECH = '';
async function pageCal() {
  if (INIT.me.role === 'user') return pageRegister();
  const u = new URL(location.href).searchParams;
  const from = u.get('d') || '';
  app.innerHTML = topBar(INIT.me.role === 'admin' ? 'ตารางงานช่าง' : 'ตารางงานของฉัน', 'staff') + '<div class="wrap" id="c"><div class="empty">กำลังโหลด...</div></div>';
  await swr('sc' + from, () => api('schedule', { from: from, days: 14 }), r => drawCal(r, from));
}
function drawCal(r, from) {
  const sel = from || r.today;
  const day = r.list.find(x => x.iso === sel) || r.list[0];
  if (!r.isAdmin) CAL_TECH = '';
  const techOpts = r.isAdmin ? `<select id="ft"><option value="">ช่างทุกคน</option>${r.techs.map(x => `<option value="${x.uid}"${x.uid === CAL_TECH ? ' selected' : ''}>${esc(x.name)}</option>`).join('')}</select>` : '<div style="flex:1"></div>';
  const keep = j => !CAL_TECH || j.tech_uid === CAL_TECH;
  const jobHtml = j => `<div class="slot"><div class="tm">${esc(j.time)}</div><div class="bd">
      <a href="javascript:void 0" onclick="go('job','${j.no}')"><b>#${j.no}</b> ${esc(j.items || '')}</a>
      <div class="t2">🔧 ${esc(j.tech)} · 📍 ${esc(j.place)} · 👤 ${esc(j.reporter)}</div>
      ${j.resched ? '<div class="t2" style="color:var(--warn-ink,#A35200)">⚠ ผู้แจ้งขอเลื่อนเป็น ' + esc(j.resched_when) + '</div>' : ''}
      </div><div>${badge(j.status)}</div></div>`;
  const dayCard = (d, compact) => {
    const jobs = d.jobs.filter(keep);
    if (compact && !jobs.length) return `<div class="hint" style="margin:0 0 6px">${d.iso === r.today ? 'วันนี้ · ' : ''}${esc(d.dow)} ${esc(d.label)} — ไม่มีนัดหมาย</div>`;
    return `<div class="card"><h2 style="margin-bottom:6px">${d.iso === r.today ? 'วันนี้ · ' : ''}${esc(d.dow)} ${esc(d.label)} <span class="small" style="font-weight:400">${jobs.length} งาน</span></h2>
      ${jobs.length ? jobs.map(jobHtml).join('') : '<div class="muted small" style="padding:6px 0">ไม่มีนัดหมาย</div>'}</div>`;
  };
  $('#c').innerHTML = `<div class="cal">${r.list.slice(0, 14).map(d => {
      const n = d.jobs.filter(keep).length;
      return `<button data-d="${d.iso}" class="${d.iso === sel ? 'on' : ''}"><span>${esc(d.dow)}</span><b>${esc(d.label.slice(0, 5))}</b><i>${n ? n + ' งาน' : '—'}</i></button>`;
    }).join('')}</div>
    <div class="row" style="margin-bottom:10px">${techOpts}<div class="seg" style="flex:none"><button type="button" data-v="day" class="${CAL_VIEW === 'day' ? 'on' : ''}">รายวัน</button><button type="button" data-v="week" class="${CAL_VIEW === 'week' ? 'on' : ''}">7 วัน</button></div></div>
    <div id="cl">${CAL_VIEW === 'day' ? dayCard(day) : r.list.slice(0, 7).map(d => dayCard(d, true)).join('')}</div>
    <div class="row" style="margin:10px 0 18px">
      <button class="btn sec sm" onclick="go('cal',null,{d:'${esc(addDaysIso(sel, CAL_VIEW === 'day' ? -1 : -7))}'})">← ${CAL_VIEW === 'day' ? 'วันก่อน' : '7 วันก่อน'}</button>
      ${sel !== r.today ? `<button class="btn sec sm" style="flex:.7" onclick="go('cal')">วันนี้</button>` : ''}
      <button class="btn sec sm" onclick="go('cal',null,{d:'${esc(addDaysIso(sel, CAL_VIEW === 'day' ? 1 : 7))}'})">${CAL_VIEW === 'day' ? 'วันถัดไป' : '7 วันถัดไป'} →</button></div>`;
  app.querySelectorAll('.cal button').forEach(b => b.onclick = () => go('cal', null, { d: b.dataset.d }));
  app.querySelectorAll('.seg button').forEach(b => b.onclick = () => { CAL_VIEW = b.dataset.v; LS.set('calView', CAL_VIEW); drawCal(r, sel); });
  const ft = $('#ft'); if (ft) ft.onchange = () => { CAL_TECH = ft.value; drawCal(r, sel); };
}
function addDaysIso(iso, n) { const d = new Date(iso + 'T00:00:00+07:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }

    async () => { const x = await run(() => api('staffCode', { kind: b.dataset.new })); toast('รหัสใหม่: ' + x.code); refresh('team'); pageTeam(); }));
  app.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => editStaff(r.staff.find(x => x.uid === b.dataset.edit)));

function editStaff(x) {
  const st = { role: x.role, active: x.active };
  app.insertAdjacentHTML('beforeend', `<div class="sheet" id="esSheet"><div class="sbox">
    <h2>แก้ไขเจ้าหน้าที่</h2>
    <label class="f">ชื่อ-นามสกุล (แสดงในใบแจ้งซ่อมและรายงาน) <b>*</b></label><input type="text" id="esN" value="${esc(x.name)}">
    <label class="f">เบอร์โทร</label><input type="tel" id="esP" value="${esc(x.phone)}">
    <label class="f">บทบาท</label><div class="seg" id="esR"><button type="button" data-v="tech">ช่าง</button><button type="button" data-v="admin">แอดมิน</button></div>
    <label class="f">สถานะ</label><div class="seg" id="esA"><button type="button" data-v="1">ใช้งาน</button><button type="button" data-v="0">ปิดใช้งาน</button></div>

  const paint = () => {
    app.querySelectorAll('#esR button').forEach(b => b.classList.toggle('on', b.dataset.v === st.role));

    const w = $('#esW'), msgs = [];
    if (!st.active && x.active && x.openNow) msgs.push('มีงานค้าง ' + x.openNow + ' ใบ — ปิดใช้งานแล้วงานยังค้างชื่อคนนี้ ควรมอบหมายให้คนอื่นก่อน');

    if (x.me && (st.role !== 'admin' || !st.active)) msgs.push('นี่คือบัญชีของคุณเอง — บันทึกแล้วคุณจะเข้าหน้านี้ไม่ได้อีก');
    w.className = msgs.length ? 'note warn' : 'hidden'; w.innerHTML = msgs.map(esc).join('<br>');

/** หน้าต่างยืนยันแบบไม่ใช้ confirm() ของเบราว์เซอร์ */
function confirmSheet(title, body, okText, fn) {
  app.insertAdjacentHTML('beforeend', `<div class="sheet" id="cfSheet"><div class="sbox"><h2>${esc(title)}</h2><div class="hint">${esc(body)}</div>
    <div class="row" style="margin-top:14px"><button class="btn sec" id="cfX">ยกเลิก</button><button class="btn" id="cfOk">${esc(okText)}</button></div></div></div>`);
  const close = () => { const e = $('#cfSheet'); if (e) e.remove(); };
  $('#cfX').onclick = close; $('#cfSheet').onclick = e => { if (e.target.id === 'cfSheet') close(); };
  $('#cfOk').onclick = async () => { close(); await fn(); };
}
async function copyText(t, okMsg) {
  try { await navigator.clipboard.writeText(t); toast(okMsg); return; } catch (e) { /* บางเครื่องใน LINE ไม่อนุญาต ใช้วิธีสำรอง */ }
  const ta = document.createElement('textarea'); ta.value = t; ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0'; document.body.appendChild(ta);
  ta.focus(); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove(); toast(ok ? okMsg : 'คัดลอกไม่ได้ — กดค้างที่รหัสเพื่อคัดลอกเอง');
}

    const df = Math.round((a - b) * 10) / 10;
    if (!df) return `<span class="nt">เท่ากับ${esc(o.prevLabel.split(' ')[0])}</span>`;
    const good = better === 0 ? null : (df > 0) === (better > 0);
    return `<span class="${good === null ? 'nt' : good ? 'up' : 'dn'}">${df > 0 ? '▲' : '▼'} ${Math.abs(df)}${unit || ''} จากเดือนก่อน</span>`;

      <div class="kpi"><div class="lb">ปิดแล้ว / คงค้าง</div><div class="v">${s.closed} <span style="font-size:18px;color:var(--muted)">/ ${s.open}</span></div><div class="dl">${delta(s.open, p.open, -1, ' งานค้าง')}</div></div>
      <div class="kpi"><div class="lb">KPI งานใหม่ ทันใน ${o.slaDays} วัน (เป้า ${o.kpiTarget}%)</div><div class="v" style="color:${s.isoPct === null ? 'inherit' : s.isoPct >= o.kpiTarget ? '#2B8A3E' : 'var(--bad)'}">${s.isoPct === null ? '-' : s.isoPct + '%'}</div><div class="dl">${delta(s.isoPct, p.isoPct, 1, '%')}</div></div>
      <div class="kpi"><div class="lb">KPI งานแก้ ทันใน ${o.slaDays} วัน</div><div class="v" style="color:${s.reworkPct === null ? 'inherit' : s.reworkPct >= o.kpiTarget ? '#2B8A3E' : 'var(--bad)'}">${s.reworkPct === null ? '-' : s.reworkPct + '%'}</div><div class="dl"><span class="nt">ส่งกลับแก้ไข ${s.rejected} ใบ · พักงาน ${s.paused} ใบ</span></div></div>
      <div class="kpi"><div class="lb">ความพึงพอใจเฉลี่ย (เต็ม 5)</div><div class="v">${s.avgRating === null ? '-' : s.avgRating}</div><div class="dl">${delta(s.avgRating, p.avgRating, 1)}</div></div>
    </div>
    <div class="dgrid">
      <div class="card wide"><h2>งานที่ต้องติดตาม (ณ ตอนนี้)</h2>
        <div class="fchips">${fdefs.map(x => `<button class="fchip${x[0] === DASH_FILTER ? ' on' : ''}" data-f="${x[0]}" style="background:${x[2]};color:${x[3]}">${x[1]}<b>${f[x[0]].length}</b></button>`).join('')}</div>
        <div class="flist" id="fl"></div></div>
      <div class="card wide"><h2>งานรายวัน · ${esc(o.label)}</h2>${dailyChart(o.daily, o.lastDay)}
        <div class="legend"><span><i style="background:#1C7ED6"></i>แจ้งเข้า</span><span><i style="background:#2F9E44"></i>ทำเสร็จ</span></div></div>
      <div class="card"><h2>ตามประเภทงาน</h2>${o.categories.map(c => `<div class="hbar"><span>${esc(c.name)}</span><div class="tr"><div class="fl" style="width:${c.n * 100 / maxCat}%;background:${c.color || CAT_COL[c.name] || '#868E96'}"></div></div><span class="n">${c.n}</span></div>`).join('')}

      <div class="card"><h2>ตามช่างผู้ปฏิบัติงาน</h2><table class="tt"><tr><th>ช่าง</th><th>งานค้าง<br>ตอนนี้</th><th>งาน<br>เดือนนี้</th><th>ปิด<br>แล้ว</th><th>ทัน<br>${o.slaDays} วัน</th><th>ส่งกลับ<br>แก้ไข</th><th>คะแนน</th></tr>
        ${o.techs.map(t => `<tr><td>${esc(t.name)}</td><td style="font-weight:700;color:${t.openNow > 3 ? 'var(--bad)' : 'inherit'}">${t.openNow}</td><td>${t.month}</td><td>${t.closed}</td><td>${t.isoPct === null ? '-' : t.isoPct + '%'}</td><td>${t.rework || 0}</td><td>${t.rating === null ? '-' : t.rating}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">ยังไม่มีช่าง</td></tr>'}</table></div>
      <div class="card"><h2>รายการที่แจ้งบ่อย</h2>${o.topItems.map(b => `<div class="hbar"><span>${esc(b.name)}</span><div class="tr"><div class="fl" style="width:${b.n * 100 / maxI}%;background:#06A94D"></div></div><span class="n">${b.n}</span></div>`).join('') || '<div class="muted small">ยังไม่มีข้อมูล</div>'}</div>
      <div class="card wide"><h2>รายงานประจำเดือน</h2>
        ${o.isAdmin ? `<button class="btn sm" id="genRep">สร้างรายงาน ${esc(o.label)} (ข้อมูลถึงวันนี้)</button><div class="hint">ระบบสร้างรายงานให้อัตโนมัติทุกวันที่ 1 อยู่แล้ว ปุ่มนี้ใช้เมื่อต้องการตัวเลขระหว่างเดือน</div>` : ''}
        <div class="rlist" style="margin-top:8px">${o.reports.map(r => `<a href="${r.url}" target="_blank"><span class="kd${r.kind === 'PDF' ? ' pdf' : ''}">${r.kind}</span><span style="flex:1">${esc(r.name)}</span><span class="muted small">${esc(r.updated)}</span></a>`).join('') || '<div class="muted small" style="padding:8px 0">ยังไม่มีรายงาน</div>'}</div></div>
    </div><div style="height:16px"></div>`;
  const drawF = () => {
    const l = f[DASH_FILTER];
    $('#fl').innerHTML = l.length ? l.slice(0, 12).map(t => `<a href="javascript:void 0" onclick="go('job','${t.no}')"><span><b>#${t.no}</b> ${esc(t.items_text || t.detail)} · ${esc(t.building.replace('อาคาร', ''))}</span>
      <span>${DASH_FILTER === 'paused' ? '⏸ ' + esc(t.pause_reason) + ' · ' + t.pausedDays + ' วัน' : DASH_FILTER === 'waitAccept' ? 'รอ ' + t.waitDays + ' วัน' : esc(t.assigned_name || 'ยังไม่มอบหมาย')} · ${DASH_FILTER === 'overdue' ? 'แจ้งมา ' + t.ageDays + ' วัน' : 'กำหนด ' + esc(t.due)}</span></a>`).join('') + (l.length > 12 ? `<div class="hint">และอีก ${l.length - 12} รายการ</div>` : '')
      : '<div class="muted small" style="padding:8px 0">ไม่มีรายการ 👍</div>';

  const g = $('#genRep'); if (g) g.onclick = async () => {

    toast('สร้างรายงานแล้ว'); window.open(r.docUrl, '_blank'); CACHE.drop('ov'); pageDash();
  };
}
function dailyChart(daily, lastDay) {
  const W = Math.max(300, Math.min(1100, window.innerWidth - 60)), H = 190, pl = 26, pb = 22, n = daily.length, bw = (W - pl) / n;
  const mx = Math.max(2, ...daily.map(d => Math.max(d.in, d.done)));
  const y = v => H - pb - v * (H - pb - 10) / mx;
  const ticks = [...new Set([0, Math.ceil(mx / 2), mx])];
  let g = ticks.map(t => `<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="#E3E8EE"/><text x="${pl - 6}" y="${y(t) + 4}" font-size="11" text-anchor="end" fill="#6B7785">${t}</text>`).join('');
  const w1 = Math.max(2, Math.min(14, bw * .36));
  daily.forEach((d, i) => {
    const cx = pl + i * bw + bw / 2;
    if (lastDay && d.d > lastDay) { g += `<rect x="${pl + i * bw}" y="${8}" width="${bw}" height="${H - pb - 8}" fill="#F8F9FA"/>`; }
    if (d.in) g += `<rect x="${cx - w1 - 1}" y="${y(d.in)}" width="${w1}" height="${H - pb - y(d.in)}" rx="2" fill="#1C7ED6"><title>วันที่ ${d.d}: แจ้งเข้า ${d.in}</title></rect>`;
    if (d.done) g += `<rect x="${cx + 1}" y="${y(d.done)}" width="${w1}" height="${H - pb - y(d.done)}" rx="2" fill="#2F9E44"><title>วันที่ ${d.d}: ทำเสร็จ ${d.done}</title></rect>`;
    if (d.d === 1 || d.d % 5 === 0 || i === n - 1) g += `<text x="${cx}" y="${H - 6}" font-size="11" text-anchor="middle" fill="#6B7785">${d.d}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${g}</svg>`;
}

/* ================= boot ================= */
async function boot() {
  const fail = e => { busy(false); app.innerHTML = `<div class="wrap"><div class="card center"><h2>เปิดระบบไม่สำเร็จ</h2><p class="muted small">${esc(e.message || e)}</p><button class="btn" onclick="location.reload()">ลองใหม่</button></div></div>`; };
  // ปลุกเซิร์ฟเวอร์ให้ตื่นไปพร้อมกับตอน LINE กำลังล็อกอิน (Apps Script ครั้งแรกจะช้า)
  if (!MOCK && CFG.GAS_URL) { try { fetch(CFG.GAS_URL, { method: 'GET', mode: 'no-cors' }); } catch (e) {} }
  // เตรียม idToken เบื้องหลัง — หน้าจะวาดจากแคชได้เลยไม่ต้องรอ
  READY = (async () => {
    if (MOCK) { await new Promise(r => { const s = document.createElement('script'); s.src = 'mock.js'; s.onload = r; document.head.appendChild(s); }); return; }
    await liff.init({ liffId: CFG.LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); await new Promise(() => {}); }
    ID_TOKEN = liff.getIDToken();
  })();
  const cachedInit = MOCK ? null : CACHE.get('init');
  if (cachedInit) {                       // เปิดครั้งต่อไป: ขึ้นหน้าทันที
    INIT = cachedInit; route();
    try {
      INIT = await refreshInit();
      // คนละบัญชี/สิทธิ์เปลี่ยน → ล้างแคชแล้ววาดใหม่
      if (JSON.stringify(INIT.me) !== JSON.stringify(cachedInit.me)) { CACHE.drop(); CACHE.set('init', INIT); route(); }
    } catch (e) { /* ใช้ของเดิมไปก่อน */ }
    return;
  }
  busy(true);
  try { INIT = await refreshInit(); busy(false); route(); } catch (e) { fail(e); }
}
async function refreshInit() {
  const r = await api('init');
  CACHE.set('init', r);
  return r;
}
